function editarVendedor(x){
  const nuevo = !x;
  const usados = vivos('vend').map((v) => v.pto);
  let sig = 1; while (usados.includes(pad(sig, 3))) sig++;
  x = x || { id: uid('v'), nombre: '', rol: 'vendedor', pto: pad(sig, 3), act: true, perm: { inv: true }, com: 0 };
  const m = modal({ title: nuevo ? 'Nuevo vendedor' : x.nombre, body: '<div class="stack"><label class="f">Nombre<input class="in" id="evN" value="' + h(x.nombre) + '" autofocus></label>' +
    '<div class="grid3"><label class="f">Rol<select class="in" id="evR"><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select></label>' +
    '<label class="f">Punto de emisión<input class="in" id="evP" inputmode="numeric" maxlength="3" value="' + h(x.pto) + '"></label>' +
    '<label class="f">Comisión %<input class="in" id="evC" inputmode="decimal" value="' + (x.com || '') + '"></label></div>' +
    '<label class="f">' + (nuevo ? 'PIN (4 a 6 números)' : 'Nuevo PIN <span class="hint">(déjalo vacío para no cambiarlo)</span>') + '<input class="in" id="evPin" type="password" inputmode="numeric" maxlength="6"></label>' +
    '<div id="evPerm"><div class="small muted" style="font-weight:700">Permisos del vendedor</div>' + Object.keys(PERMISOS).map((k) => '<label class="chk"><input type="checkbox" data-p="' + k + '"' + (x.perm && x.perm[k] ? ' checked' : '') + '> ' + PERMISOS[k] + '</label>').join('') + '</div>' +
    '<label class="chk"><input type="checkbox" id="evA"' + (x.act !== false ? ' checked' : '') + '> Activo (puede iniciar sesión)</label></div>',
    foot: '<button class="btn" data-x>Cancelar</button>' + (!nuevo && x.id !== USR.id ? '<button class="btn c3d cr" id="evDel">' + ic('trash') + 'Eliminar</button>' : '') + '<button class="btn c3d cv" id="evOk">' + ic('check') + 'Guardar</button>' });
  m.q('#evR').value = x.rol;
  if (m.q('#evDel')) m.q('#evDel').onclick = async () => {
    if (x.rol === 'admin' && vivos('vend').filter((v) => v.rol === 'admin' && v.act !== false && v.id !== x.id).length === 0) return toast('Debe quedar al menos un administrador activo.', true);
    const nd = vivos('vta').filter((d) => d.v === x.id).length;
    if (!(await confirmar('¿Eliminar a ' + x.nombre + '? Ya no podrá entrar a la app en ningún equipo. ' + (nd ? 'Sus ' + nd + ' documentos y ventas se conservan en los reportes con su nombre.' : ''), 'Eliminar', true))) return;
    await borrar('vend', x.id); m.close(); toast(x.nombre + ' eliminado'); render();
  };
  const permVis = () => { m.q('#evPerm').style.display = m.q('#evR').value === 'admin' ? 'none' : ''; }; permVis(); m.q('#evR').onchange = permVis;
  m.q('#evOk').onclick = async () => {
    const n = m.q('#evN').value.trim(); if (!n) return toast('Escribe el nombre.', true);
    const pto = pad(parseInt(m.q('#evP').value, 10) || 1, 3);
    const otro = vivos('vend').find((v) => v.pto === pto && v.id !== x.id); if (otro) return toast('El punto ' + pto + ' ya es de ' + otro.nombre, true);
    const pin = m.q('#evPin').value.trim();
    if ((nuevo || pin) && !/^\d{4,6}$/.test(pin)) return toast('El PIN debe tener de 4 a 6 números.', true);
    const rol = m.q('#evR').value, act = m.q('#evA').checked;
    if (x.rol === 'admin' && (rol !== 'admin' || !act) && vivos('vend').filter((v) => v.rol === 'admin' && v.act !== false && v.id !== x.id).length === 0) return toast('Debe quedar al menos un administrador activo.', true);
    const perm = {}; qsa('[data-p]', m.el).forEach((c) => { if (c.checked) perm[c.dataset.p] = true; });
    Object.assign(x, { nombre: n, rol, pto, com: parseFloat(m.q('#evC').value) || 0, act, perm, _d: 0 });
    if (pin) x.pin = await sha(pin);
    await put('vend', x); if (USR && x.id === USR.id) { USR = x; pintarNav(); }
    m.close(); toast('Vendedor guardado'); render();
  };
}

async function exportarFilas(nombre, cab, filas, extraHojas){
  try {
    const X = await libXLSX(); const wb = X.utils.book_new();
    const add = (nom, c, f) => { const ws = X.utils.aoa_to_sheet([c].concat(f)); ws['!cols'] = c.map((k, i) => ({ wch: Math.min(48, Math.max(String(k).length + 2, ...f.slice(0, 200).map((r) => String(r[i] == null ? '' : r[i]).length + 1))) }));
      X.utils.book_append_sheet(wb, ws, String(nom).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31)); };
    add(nombre, cab, filas); (extraHojas || []).forEach((x) => add(x[0], x[1], x[2]));
    const out = X.write(wb, { bookType: 'xlsx', type: 'array' });
    descargar(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), String(nombre).replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]+/g, '_') + ' ' + hoyISO() + '.xlsx');
  } catch (e) { toast(e.message, true); }
}

async function leerExcel(file){

function detectarCabecera(filas, campos){
  let best = 0, bestScore = -1;
  for (let i = 0; i < Math.min(15, filas.length); i++) {
    const sc = (filas[i] || []).filter((c) => campos.some((f) => f[2].test(norm(c)))).length;
    if (sc > bestScore) { bestScore = sc; best = i; }
  }
  const cab = (filas[best] || []).map((c) => String(c).trim());
  const map = {}; const usadas = new Set();
  campos.forEach(([k, , re]) => { const i = cab.findIndex((c, j) => !usadas.has(j) && re.test(norm(c))); if (i >= 0) { map[k] = i; usadas.add(i); } });
  return { fila: best, cab, map };
}

function esFilaBasura(id, n){ return /^suman\b/i.test(String(id).trim()) || !/[a-zñáéíóú]/i.test(String(n)); }
async function limpiarBasura(){
  const malos = vivos('prod').filter((p) => esFilaBasura(p.id, p.n));
  if (!malos.length) return 0;
  const ids = new Set(malos.map((p) => p.id));
  await putMuchos('prod', malos.map((p) => Object.assign({}, p, { _d: 1 })));

/* Listado de clientes exportado de Anfibius: # CEDULA | APELLIDOS | NOMBRES | ZONA | GRUPO | CODIGO INTERNO (cabecera corrida) */
function clientesAnfibius(filas){
  const hi = filas.slice(0, 15).findIndex((r) => (r || []).some((c) => /^#?\s*c[eé]dula$/i.test(String(c).trim())) && (r || []).some((c) => /^cliente$/i.test(String(c).trim())));
  if (hi < 0) return null;
  const out = [['Nombre', 'Cédula/RUC', 'Zona', 'Código Anfibius']];
  for (let i = hi + 1; i < filas.length; i++) {
    const r = filas[i] || []; const ced = String(r[0] == null ? '' : r[0]).trim().replace(/\.0$/, '');
    if (!/^\d{6,13}$/.test(ced)) continue;                       // títulos de sucursal y totales
    if (/^9{10,13}$/.test(ced) && /consumidor/i.test(r[1])) continue;  // consumidor final ya existe en la app
    const ape = String(r[1] || '').trim(); let nom = String(r[2] || '').trim();
    let com = ''; nom = nom.replace(/\(([^)]*)\)\s*$/, (m, a) => { com = a.trim(); return ''; }).trim();
    let nombre = (ape && ape !== '.' ? ape + ' ' : '') + nom;
    const sl = (x) => norm(x).replace(/[^a-z0-9]/g, '');
    if (com && sl(com) !== sl(nom) && sl(com) !== sl(nombre)) nombre += ' (' + com + ')';
    nombre = nombre.replace(/\s+/g, ' ').trim(); if (!nombre) continue;
    const zona = String(r[3] || '').trim();
    out.push([nombre, /^9+$/.test(ced) ? '' : ced, /^sin /i.test(zona) ? '' : zona, r[5] === '' ? '' : String(r[5])]);
  }
  return out;
}

/* =====================================================================
   VENTAS HISTÓRICAS DE ANFIBIUS ("ven_ventas_retenciones_tipo")
   Columnas: FECHA | SERIE | N° | CED/RUC | COMPRADOR | V/LÍQUIDO | IVA | TOTAL | RET. IVA | RET. FUENTE | TOTAL | ESTADO
   Se guardan como ventas marcadas "anf": sin productos (no tocan el stock), contado ya cobrado
   (no crean cuentas por cobrar) y no cambian la numeración de las facturas del POS.
   ===================================================================== */
const fechaExcel = (n) => { if (typeof n === 'number') return new Date(Math.round((n - 25569) * 864e5)).toISOString().slice(0, 10);
  const m = String(n || '').match(/(\d{1,2})[/-](\d{1,2})[/-](\d{4})/); if (m) return m[3] + '-' + pad(m[2], 2) + '-' + pad(m[1], 2);
  const m2 = String(n || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m2 ? m2[0] : ''; };
const tpAnfibius = (sec) => (/fac/i.test(sec) || /^mass ferreteria$/i.test(norm(sec)) ? 'F' : 'N');   // "MASS FERRETERIA" = facturas preimpresas
function leerVentasAnfibius(hojas){
  const out = []; let sec = '', vistoCab = false; const st = { anuladas: 0, filas: 0 };
  hojas.forEach((H) => H.filas.forEach((r) => {
    const c0 = r[0];
    if (typeof c0 !== 'number' && !/^\d{1,2}[/-]\d{1,2}[/-]\d{4}$/.test(String(c0).trim())) {
      const t = String(c0 || '').trim();
      if (/^fecha$/i.test(t)) { vistoCab = true; return; }
      if (t && !/total/i.test(t) && (r.slice(1).every((x) => x === '' || x == null))) sec = t;   // título del tipo de documento
      return;
    }
    const f = fechaExcel(c0); if (!f) return;
    st.filas++;
    if (/anulad/i.test(String(r[11] || ''))) { st.anuladas++; return; }
    const serie = String(r[1] || '').replace(/\D/g, ''), n = parseInt(r[2], 10) || 0;
    const base = Number(r[5]) || 0, iva = Number(r[6]) || 0, tot = Number(r[7]) || 0;
    out.push({ f, sec: sec || 'VENTA', serie, n, ruc: String(r[3] || '').trim(), nom: String(r[4] || '').trim(), base, iva, tot, riva: Number(r[8]) || 0, rfte: Number(r[9]) || 0 });
  }));
  return { ventas: out, vistoCab, st };
}

    return rec;
  });

  const ok = await new Promise((res) => {
    const m = modal({ title: 'Importar ventas de Anfibius', wide: true, body:
      '<div class="kpis" style="margin-bottom:10px"><div class="kpi gold"><span>Ventas válidas</span><b>' + recs.length.toLocaleString('es') + '</b><small>' + fechaTxt(f1) + ' al ' + fechaTxt(f2) + '</small></div>' +

const SELPED = new Map();          // productos marcados en el reporte: id -> { pr, q }

/** Último proveedor que nos vendió el producto (según compras registradas) */
function provHabitual(pid){
  const p = S.prod.get(pid); if (p && p.prov && S.prov.get(p.prov) && !S.prov.get(p.prov)._d) return p.prov;
  let best = null, bf = '';
  S.com.forEach((c) => { if (!c._d && !c.an && c.td !== 'ND' && c.f >= bf && (c.it || []).some((x) => x.p === pid)) { best = c.pr; bf = c.f; } });
  return best || '';
}
const opcionesProv = (sel) => '<option value="">— Proveedor —</option>' + vivos('prov').sort((a, b) => a.nombre.localeCompare(b.nombre)).map((p) => '<option value="' + h(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + h(p.nombre) + '</option>').join('');
function sugerido(p, s, vend30){
  const mi = Number(p.mi) || 0;
  return Math.max(1, Math.ceil(Math.max(mi * 2 - s, vend30 - Math.max(0, s), mi - s)));
}

async function crearPedidosDesdeSeleccion(){
  const sel = Array.from(SELPED.entries());
  if (sel.some(([, s]) => !s.pr)) return toast('Elige el proveedor de todos los productos marcados.', true);
  const grupos = new Map(); sel.forEach(([id, s]) => { if (!(s.q > 0)) return; if (!grupos.has(s.pr)) grupos.set(s.pr, []); grupos.get(s.pr).push([id, s.q]); });
  if (!grupos.size) return toast('Pon una cantidad mayor a 0.', true);
  // recuerda el proveedor habitual de cada producto
  const prods = []; sel.forEach(([id, s]) => { const p = S.prod.get(id); if (p && p.prov !== s.pr) prods.push(Object.assign({}, p, { prov: s.pr })); });
  if (prods.length) await putMuchos('prod', prods);
  const creados = [];
  for (const [pr, its] of grupos) {
    const existente = vivos('ped').find((x) => x.pr === pr && x.est === 'pend');
    const it = its.map(([id, q]) => { const p = S.prod.get(id) || { n: id }; return { p: id, n: p.n, q, co: Number(p.co) || 0, un: p.un || 'UND' }; });
    if (existente) {
      const e = Object.assign({}, existente, { it: existente.it.slice() });
      it.forEach((x) => { const y = e.it.find((z) => z.p === x.p); if (y) y.q = x.q; else e.it.push(x); });
      await put('ped', e); creados.push(e);
    } else {
      const ped = { id: uid('pp'), num: siguientePedidoProv(), pr, f: hoyISO(), ts: Date.now(), v: USR.id, it, est: 'pend', nota: '' };
      await put('ped', ped); creados.push(ped);
    }
  }
  SELPED.clear();
  toast(creados.length === 1 ? 'Pedido ' + creados[0].num + ' listo' : creados.length + ' pedidos creados (uno por proveedor)');
  render();
  if (creados.length === 1) verPedido(S.ped.get(creados[0].id)); else verPedidos();
}
function siguientePedidoProv(){
  let max = 0; S.ped.forEach((p) => { const n = parseInt(String(p.num || '').replace(/\D/g, ''), 10); if (n > max) max = n; });
  return 'PP-' + pad(max + 1, 6);
}

    for (; i < s.length; i += 2) vals.push(parseInt(s.substr(i, 2), 10));

    vals.push(104); for (const ch of s) vals.push(ch.charCodeAt(0) - 32);
  }
  let sum = vals[0]; for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103);

/** PDF con el tamaño exacto de la etiqueta (sirve para cualquier impresora) */
async function pdfEtiquetas(lista, C){
  const J = await libPDF();
  const PW = C.cols * C.w + (C.cols - 1) * C.gap, PH = C.h + (Number(C.gv) || 0);
  const doc = new J({ unit: 'mm', format: [PW, PH], orientation: PW > PH ? 'l' : 'p' });
  const todas = []; lista.forEach((x) => { for (let i = 0; i < x.q; i++) todas.push(x.p); });
  const pt = (mm) => mm / 0.3528;
  const K = cajasEtq(C), fs = letrasEtq(C);
  todas.forEach((p, idx) => {
    const col = idx % C.cols; if (idx && !col) doc.addPage([PW, PH], PW > PH ? 'l' : 'p');
    const X0 = col * (C.w + C.gap) + C.offX, Y0 = C.offY; doc.setTextColor(0, 0, 0); doc.setFillColor(0, 0, 0);
    ETQ_EL.forEach(([k]) => {
      if (!elVisible(C, k)) return; const b = K[k], E = estiloEl(C, k), al = E.al, fw = E.b ? 'bold' : 'normal';
      if (k === 'B') { const z = barrasEtq(p, C, b); const bx = X0 + b.x + (b.w - z.bw) / 2;
        for (let i = 0; i < z.bc.mods.length;) { if (z.bc.mods[i] === '1') { let j = i; while (z.bc.mods[j] === '1') j++; doc.rect(bx + i * z.mw, Y0 + b.y, (j - i) * z.mw, b.h, 'F'); i = j; } else i++; }
        return; }
      const t = textoEl(k, p, C); if (!t) return;
      doc.setFont(E.pdf, fw); doc.setFontSize(pt(fs[k]));
      const iva = k === 'P' && C.ivaTxt ? ' inc. IVA' : '';
      let anchoIva = 0; if (iva) { doc.setFont('helvetica', 'normal'); doc.setFontSize(pt(fs.P * 0.4)); anchoIva = doc.getTextWidth(iva); doc.setFont(E.pdf, fw); doc.setFontSize(pt(fs.P)); }
      const max = Math.max(1, Math.floor((b.h + 0.2) / (fs[k] * 1.1)));
      let lns = doc.splitTextToSize(t, Math.max(1, b.w - anchoIva)); if (lns.length > max) { lns = lns.slice(0, max); lns[max - 1] = lns[max - 1].replace(/\s*\S*$/, '') + '…'; }
      const alto = lns.length * fs[k] * 1.1; let y = Y0 + b.y + (b.h - alto) / 2 + fs[k] * 0.82;
      lns.forEach((l, i) => {
        const xa = al === 'left' ? X0 + b.x : al === 'right' ? X0 + b.x + b.w - (i === lns.length - 1 ? anchoIva : 0) : X0 + b.x + (b.w - (i === lns.length - 1 ? anchoIva : 0)) / 2;
        doc.text(l, xa, y, { align: al });
        if (iva && i === lns.length - 1) { const wl = doc.getTextWidth(l); const xi = al === 'left' ? xa + wl : al === 'right' ? xa : xa + wl / 2;
          doc.setFont(E.pdf, 'normal'); doc.setFontSize(pt(fs.P * 0.4)); doc.text(iva, xi, y); doc.setFont(E.pdf, fw); doc.setFontSize(pt(fs.P)); }
        y += fs[k] * 1.1; });
    });
  });
  return doc;
}

  location.href = 'intent:data:application/pdf;base64,' + b64 + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=ru.a402d.rawbtprinter') + ';end;';
}
/* ---------- Compartir PDF ---------- */
async function compartirPDFEtq(lista, C){
  const d = await pdfEtiquetas(lista, C); const blob = d.output('blob'); const nom = 'Etiquetas ' + C.w + 'x' + C.h + '.pdf';
  const file = new File([blob], nom, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: nom }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  descargar(blob, nom); toast('PDF descargado: ábrelo y usa Imprimir o Compartir.');
}
/* ---------- Ventana de impresión del sistema (en el celular se abre en una pestaña) ---------- */
function imprimirSistema(html){
  if (!esCelular()) return imprimirHTML(html);
  const w = window.open('', '_blank');
  if (!w) return imprimirHTML(html);
  w.document.open(); w.document.write(html.replace('</body>', '<scr' + 'ipt>setTimeout(function(){window.print()},400)</scr' + 'ipt></body>')); w.document.close();
}

/* =====================================================================
   ESTACIÓN DE IMPRESIÓN: el teléfono envía las etiquetas a la nube y la PC
   que tiene la impresora (Zebra por USB) las imprime sola.
   Tabla 'imp': { id, ts, f, v, it:[{p,q}], est:'pend'|'proc'|'ok', por, fin }
   ===================================================================== */
const esEstacion = () => !!ls.get('estacion', false);
const estCfg = () => Object.assign({ w: 0, h: 0, cols: 1, gap: 0, gv: 0 }, ls.get('estCfg', {}));
async function enviarAEstacion(lista){
  const job = { id: uid('im'), ts: Date.now(), f: hoyISO(), v: USR ? USR.id : '', it: lista.map((x) => ({ p: x.p.id, q: x.q })), est: 'pend' };
  await put('imp', job, true);
  const ok = await sincronizar(); if (!ok) programarSync(3000);
  toast(ok ? 'Enviado a la estación de impresión (' + lista.reduce((s, x) => s + x.q, 0) + ' etiquetas). Saldrá en la impresora de la PC en unos segundos.' : 'Guardado: se enviará a la estación cuando haya internet.', !ok);
}
/** Configuración que usa la estación: el diseño general + la medida de la etiqueta de su impresora */
function cfgEstacion(){
  const C = etqCfg(), E = estCfg();
  if (E.w && E.h) Object.assign(C, { w: E.w, h: E.h, cols: E.cols || 1, gap: E.gap || 0, gv: E.gv || 0 });
  C.met = 'sistema'; return C;
}
let estTimer = null, estOcupada = false;
async function procesarCola(){
  if (estOcupada || !USR) return; estOcupada = true;
  try {
    await sincronizar();
    const pend = vivos('imp').filter((j) => j.est === 'pend').sort((a, b) => a.ts - b.ts);
    if (!pend.length) return;
    const j = pend[0];
    const lista = (j.it || []).map((x) => ({ p: S.prod.get(x.p), q: Math.max(1, Math.round(x.q) || 1) })).filter((x) => x.p);
    await put('imp', Object.assign({}, j, { est: 'proc', por: M.dev || 'PC' }), true);
    if (lista.length) imprimirHTML(documentoEtiquetas(lista, cfgEstacion()));
    await put('imp', Object.assign({}, S.imp.get(j.id), { est: 'ok', fin: Date.now() }), true);
    sincronizar();
    if (RUTA === 'ajustes') pintarColaEst();
  } catch (e) { /* se reintenta en la próxima vuelta */ } finally { estOcupada = false; }
}
function iniciarEstacion(){
  clearInterval(estTimer); estTimer = null;
  if (esEstacion()) { estTimer = setInterval(procesarCola, 20000); setTimeout(procesarCola, 1500); }
  pintarEstBadge();
}
function pintarEstBadge(){
  let b = document.getElementById('estBadge');
  if (!esEstacion()) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'estBadge'; b.className = 'estbadge'; b.title = 'Esta PC imprime las etiquetas que se envían desde los teléfonos'; document.body.appendChild(b); }
  b.innerHTML = ic('barcode') + 'Estación de impresión activa';
}
function pintarColaEst(){
  const el = document.getElementById('estCola'); if (!el) return;
  const l = vivos('imp').sort((a, b) => b.ts - a.ts).slice(0, 12);
  el.innerHTML = l.length ? l.map((j) => '<div class="row small" style="margin:3px 0"><span>' + fechaTxt(j.f) + ' ' + horaTxt(j.ts) + ' · ' + h(nomVend(j.v)) + ' · ' + (j.it || []).reduce((s, x) => s + x.q, 0) + ' etiquetas</span><span class="spacer"></span>' +
    '<span class="badge ' + (j.est === 'ok' ? 'ok' : j.est === 'proc' ? 'info' : 'gold') + '">' + (j.est === 'ok' ? 'Impreso' : j.est === 'proc' ? 'Imprimiendo' : 'En cola') + '</span></div>').join('') : '<div class="small muted">Todavía no hay envíos.</div>';
}
/** Tarjeta en Ajustes para convertir esta PC en estación */
function tarjetaEstacion(){
  const E = estCfg();
  return '<div class="card stack" id="estCard"><h3>Estación de impresión (impresora de la PC)</h3>' +
    '<p class="small muted" style="margin:0">Actívala <b>solo en la computadora que tiene la impresora de etiquetas</b> (por ejemplo la Zebra por USB). Los teléfonos envían las etiquetas y esta PC las imprime sola mientras POS MASS MF esté abierto aquí.</p>' +
    '<label class="chk"><input type="checkbox" id="estOn"' + (esEstacion() ? ' checked' : '') + '> Esta computadora es la estación de impresión</label>' +
    '<div class="grid3"><label class="f">Ancho de la etiqueta de esta impresora (mm)<input class="in" id="estW" inputmode="decimal" value="' + (E.w || '') + '" placeholder="igual que la general"></label>' +
    '<label class="f">Alto (mm)<input class="in" id="estH" inputmode="decimal" value="' + (E.h || '') + '" placeholder="igual que la general"></label>' +
    '<label class="f">Etiquetas por fila<select class="in" id="estCols"><option>1</option><option>2</option><option>3</option></select></label></div>' +
    '<div class="row"><button class="btn c3d cs" id="estPrueba" type="button">' + ic('ticket') + 'Imprimir etiqueta de prueba aquí</button></div>' +
    '<div class="note small"><b>Para que imprima sin preguntar:</b> pon tu impresora de etiquetas (matriz.zebra) como <b>predeterminada</b> en Windows y abre POS MASS MF con un acceso directo de Chrome que tenga al final <code>--kiosk-printing</code>. Si no, cada envío abrirá la ventana de impresión y habrá que pulsar Imprimir. Deja POS MASS MF abierto (no minimizado).</div>' +
    '<div><b class="small">Últimos envíos</b><div id="estCola" style="margin-top:4px"></div></div></div>';
}
function activarTarjetaEstacion(){
  if (!document.getElementById('estCard')) return;
  const E = estCfg(); $('estCols').value = String(E.cols || 1);
  const guardar = () => { ls.set('estCfg', { w: parseFloat(String($('estW').value).replace(',', '.')) || 0, h: parseFloat(String($('estH').value).replace(',', '.')) || 0, cols: +$('estCols').value || 1, gap: 0, gv: 0 }); };
  ['estW', 'estH', 'estCols'].forEach((i) => { $(i).onchange = guardar; });
  $('estOn').onchange = (e) => { ls.set('estacion', e.target.checked); iniciarEstacion(); toast(e.target.checked ? 'Esta PC ahora imprime las etiquetas enviadas desde los teléfonos' : 'Estación de impresión desactivada'); };
  $('estPrueba').onclick = () => { guardar(); const p = vivos('prod')[0] || { id: '12345', n: 'PRODUCTO DE PRUEBA', pv: 1 }; imprimirHTML(documentoEtiquetas([{ p, q: 1 }], cfgEstacion())); };
  pintarColaEst();
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
document.addEventListener('datos-nube', () => {
  pintarSync();
  if (!USR) { if ($('login') && !qs('#pinDots')) pantallaLogin(); return; }
  const fresh = S.vend.get(USR.id); if (fresh) { if (fresh._d || fresh.act === false) return cerrarSesion(); USR = fresh; }
  const ocupado = $('modals').children.length || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
  if (!ocupado && RUTA !== 'vender') render();
});

(async function iniciar(){
  try { await cargarTodo(); }
  catch (e) { document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif"><h2>No se pudo abrir la base de datos</h2><p>' + h(e.message) + '</p><p>Si usas una ventana privada, abre la app en una ventana normal.</p></div>'; return; }
  // Enlace de conexión enviado por el administrador: #conectar=...
  const m = location.hash.match(/conectar=([\w-]+)/);
  if (m) {
    try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))); if (o.u) { M.nube = { url: o.u, clave: o.k || '' }; await metaSet('nube', M.nube); toast('Teléfono conectado a la nube de MASS FERRETERÍA'); } } catch (e) { toast('El enlace de conexión no es válido.', true); }
    history.replaceState(null, '', location.pathname + '#vender');
  }
  ultimoSync = ls.get('ultimoSync', 0);
  cargarFotos().then(() => { if (USR && RUTA !== 'vender' && !$('modals').children.length) render(); });
  pintarSync();
  const ses = ls.get('sesion', null); const v = ses && S.vend.get(ses.id);
  if (v && !v._d && v.act !== false) entrar(v);
  else { pantallaLogin(); if (M.nube) sincronizar().then((ok) => { if (ok && !USR) pantallaLogin(); }); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

// estación de impresión de etiquetas (si esta PC está marcada como estación)
setTimeout(() => { try { iniciarEstacion(); } catch (e) {} }, 3000);

</script>
