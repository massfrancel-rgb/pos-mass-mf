<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POS MASS MF</title>
<meta name="description" content="Punto de venta de MASS FERRETERÍA para vendedores: ventas, facturas, pedidos, compras, inventario y reportes.">
<meta name="theme-color" content="#1A1814">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="pos-192.png">
<link rel="apple-touch-icon" href="pos-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS MASS MF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface2:#FBFAF6; --line:#E7E2D6; --fg:#1A1814; --muted:#5E584C;
  --gold:#C99A2E; --gold-ink:#8A6510; --gold-soft:#F3E9CF; --dark:#1A1814; --on-dark:#F2EEE5;
  --warn-bg:#F6E3DA; --warn-fg:#8A2E0E; --ok-bg:#E1EFDF; --ok-fg:#25562A; --info-bg:#E2EAF3; --info-fg:#24476B;
  --wa:#1F9D55; --shadow:0 1px 2px rgba(26,24,20,.06),0 4px 16px rgba(26,24,20,.06);
  --font-display:'Archivo',system-ui,sans-serif; --font-body:'Source Sans 3',system-ui,sans-serif;
  --nav-h:62px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130F; --surface:#1F1C17; --surface2:#24211B; --line:#38332A; --fg:#F2EEE5; --muted:#B4AC9C;
  --gold:#D6A93E; --gold-ink:#E2BE62; --gold-soft:#3A3020; --warn-bg:#47261A; --warn-fg:#F2B69C;
  --ok-bg:#1F3622; --ok-fg:#A9D8A8; --info-bg:#1E2D3D; --info-fg:#A9C8EA; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130F; --surface:#1F1C17; --surface2:#24211B; --line:#38332A; --fg:#F2EEE5; --muted:#B4AC9C;
  --gold:#D6A93E; --gold-ink:#E2BE62; --gold-soft:#3A3020; --warn-bg:#47261A; --warn-fg:#F2B69C;
  --ok-bg:#1F3622; --ok-fg:#A9D8A8; --info-bg:#1E2D3D; --info-fg:#A9C8EA; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-ink)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
h2{font-size:22px} h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13.5px} .right{text-align:right} .center{text-align:center}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* ---------- estructura ---------- */
#app{min-height:100vh;display:flex}
#side{display:none}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:30;background:var(--dark);color:var(--on-dark);display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
header.top img{width:34px;height:39px;object-fit:contain}
header.top .tt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
header.top .tt b{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.02em}
header.top .tt span{font-size:12.5px;color:#CFC6B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncb{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:0;color:var(--on-dark);
  border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#8C8578;flex:none}
.dot.ok{background:#4CC274}.dot.pend{background:#E8B23C}.dot.err{background:#E0573A}.dot.run{background:#E8B23C;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.userb{background:var(--gold);color:#1A1814;border:0;border-radius:999px;width:36px;height:36px;font-family:var(--font-display);font-weight:800;cursor:pointer;flex:none}
main#view{flex:1;padding:16px 14px calc(var(--nav-h) + 90px);max-width:1280px;width:100%;margin:0 auto}
nav#bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav#bottom a,#side a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);
  text-decoration:none;font-size:12px;font-weight:600}
nav#bottom a svg,#side a svg{width:23px;height:23px}
nav#bottom a.on{color:var(--gold-ink)}
nav#bottom a.on svg{stroke:var(--gold)}
@media (min-width:900px){
  #side{display:flex;flex-direction:column;width:228px;flex:none;background:var(--dark);color:var(--on-dark);position:sticky;top:0;height:100vh;padding:16px 10px;gap:2px;overflow:auto}
  #side .brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
  #side .brand img{width:40px;height:46px;object-fit:contain}
  #side .brand b{font-family:var(--font-display);font-size:18px;font-weight:800;line-height:1.05}
  #side .brand span{display:block;font-size:12px;color:#CFC6B4}
  #side a{flex-direction:row;gap:12px;padding:10px 12px;border-radius:10px;color:#D9D1C1;font-size:15px}
  #side a:hover{background:rgba(255,255,255,.06)}
  #side a.on{background:var(--gold);color:#1A1814}
  #side .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
  nav#bottom{display:none}
  header.top img,header.top .tt{display:none}
  header.top{background:var(--surface);color:var(--fg);border-bottom:1px solid var(--line)}
  header.top .crumb{font-family:var(--font-display);font-weight:800;font-size:20px}
  .syncb{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
  main#view{padding:22px 26px 60px}
}
header.top .crumb{display:none}


/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.pagehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:19px;height:19px;flex:none}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1A1814}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--warn-fg);border-color:var(--warn-bg);background:var(--warn-bg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px;border-radius:9px}
.btn.icon{padding:0;width:44px}
.btn.sm.icon{width:36px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
label.f > .hint{font-weight:400}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;color:var(--fg)}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 7px;font-size:15px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:38px}
.seg button.on{background:var(--dark);color:var(--on-dark)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent}
.badge.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.badge.info{background:var(--info-bg);color:var(--info-fg);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:18px;margin-bottom:4px}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface2)}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .s{font-size:13.5px;color:var(--muted)}
.li .v{margin-left:auto;text-align:right;font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{background:var(--dark);color:var(--on-dark);text-align:left;padding:9px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--surface2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:800;background:var(--gold-soft)!important;color:var(--fg)}
.tbl tr.click{cursor:pointer}

/* buscador */
.searchbar{display:flex;gap:8px;position:relative}
.searchbar .in{padding-left:40px}
.searchbar .ico{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:min(62vh,520px);overflow:auto}
.res{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover,.res.sel{background:var(--gold-soft)}
.res .t{font-weight:700;font-size:15px}
.res .s{font-size:13px;color:var(--muted)}
.res .p{margin-left:auto;font-family:var(--font-display);font-weight:800;white-space:nowrap;text-align:right}

/* carrito */
.cart{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.ci .t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ci .s{font-size:13px;color:var(--muted)}
.ci .tot{font-family:var(--font-display);font-weight:800;font-size:17px;text-align:right;white-space:nowrap}
.ci .ctrl{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--surface2);font-size:20px;font-weight:700;cursor:pointer}
.qty input{width:62px;height:40px;border:0;text-align:center;font-weight:800;font-size:16px;background:var(--surface)}
.mini{width:92px;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:right}
.mini.pct{width:70px}
.minilbl{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.paybar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:35;background:var(--dark);color:var(--on-dark);
  display:flex;align-items:center;gap:12px;padding:10px 14px}
.paybar .lbl{font-size:12.5px;color:#CFC6B4}
.paybar .amt{font-family:var(--font-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.paybar .btn{min-width:140px;font-size:17px;flex:none}
.pb-items{flex:none}
.pb-tot{margin-left:auto;display:flex;gap:6px 18px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
.pb-c{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.pb-c span{font-size:11.5px;color:#CFC6B4;text-transform:uppercase;letter-spacing:.04em}
.pb-c b{font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums}
.pb-c.big{background:var(--gold);color:#1A1814;border-radius:10px;padding:5px 12px}
.pb-c.big span{color:#3A2E12}
.pb-c.big b{font-size:26px}
@media (max-width:620px){.paybar{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}.pb-items{display:none}.pb-tot{flex:1 1 100%;gap:4px 12px}.pb-c b{font-size:14px}.pb-c.big b{font-size:21px}.paybar .btn{flex:1 1 100%;min-height:44px}}
main#view{padding-bottom:calc(var(--nav-h) + 150px)}
@media (min-width:900px){.paybar{left:228px;bottom:0}}

.totbox{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.totbox div{display:flex;justify-content:space-between;gap:10px}
.totbox .big{font-family:var(--font-display);font-weight:800;font-size:24px;border-top:2px solid var(--gold);padding-top:6px;margin-top:4px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--font-display);font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{color:var(--muted)}
.kpi.gold{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.kpi.gold span,.kpi.gold small{color:#CFC6B4} .kpi.gold b{color:var(--gold)}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;padding:8px 2px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.bars .b{flex:1 0 14px;max-width:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.bars .b i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.bars .b:hover i{background:var(--gold-ink)}
.bars-x{display:flex;gap:3px;padding:3px 2px 0;font-size:11px;color:var(--muted);overflow:hidden}
.bars-x span{flex:1 0 14px;max-width:46px;text-align:center;white-space:nowrap;overflow:hidden}
.hbar{height:8px;border-radius:4px;background:var(--gold);min-width:2px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,13,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{max-width:1000px}
.sheet .sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet .sh-h h3{font-size:19px;margin-right:auto}
.sheet .sh-b{padding:16px;overflow:auto;flex:1}
.sheet .sh-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.sheet .sh-f .btn{flex:1 1 140px}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 86px);z-index:90;background:var(--dark);color:var(--on-dark);
  padding:11px 18px;border-radius:12px;font-weight:600;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.err{background:#8A2E0E}

/* escáner */
#scan{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#scan video,#scanFallback{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .frame{position:absolute;left:8%;right:8%;top:30%;height:26%;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#scan .frame::after{content:'';position:absolute;left:6%;right:6%;top:50%;height:2px;background:#E0573A;box-shadow:0 0 8px #E0573A}
#scan .bar{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.85) 30%)}
#scan .last{color:#fff;font-weight:700;text-align:center;min-height:24px;text-shadow:0 1px 3px #000}
#scan .top{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.7),transparent)}

/* tarjetas de reportes con ícono 3D */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.rcard{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-decoration:none;color:var(--fg);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,24,20,.12)}
.rcard b{display:block;font-size:13.5px;line-height:1.2}
.rcard small{display:block;color:var(--muted);font-size:11.5px;line-height:1.25;margin-top:2px}
.ico3d{flex:none;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -3px 2px rgba(0,0,0,.22),0 4px 8px -2px var(--c2),0 1px 0 rgba(0,0,0,.08)}
.ico3d::after{content:'';position:absolute;left:4px;right:4px;top:3px;height:45%;border-radius:8px 8px 14px 14px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0))}
.ico3d svg{width:22px;height:22px;color:#fff;stroke-width:2.3;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.35));position:relative;z-index:1}
.rgh{margin:16px 0 8px;display:flex;gap:8px;align-items:center;font-size:16px}
.rgh .ico3d{width:28px;height:28px;border-radius:8px}.rgh .ico3d svg{width:16px;height:16px}

/* botón sincronizar */
.syncnow{min-height:36px;flex:none}
.syncnow.run svg{animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.syncb{margin-left:auto}
@media (max-width:520px){.syncnow span{display:none}.syncnow{width:38px;padding:0}.syncb{padding:6px 9px;font-size:12px}}
@media (max-width:520px){header.top .tt b{font-size:15px;white-space:nowrap}header.top{gap:7px;padding-left:10px;padding-right:10px}
  .mini{width:74px;min-height:36px;padding:5px 6px}.mini.pct{width:58px}.qty button{width:36px;height:36px}.qty input{width:48px;height:36px}.ci .ctrl{gap:6px}}
/* casilla de IVA */
.ivabox{position:relative;display:inline-flex;align-items:center}
.ivabox i{position:absolute;right:8px;font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
.ivabox input{padding-right:22px!important;text-align:right}

/** Reduce una imagen a JPEG liviano (máx. ~45 KB) para guardarla en la nube */
function comprimirFoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let lado = 520, q = 0.78, out = '';
      for (let i = 0; i < 8; i++) {
        const k = Math.min(1, lado / Math.max(img.width, img.height)); const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q); if (out.length <= 45000) break;
        if (q > 0.5) q -= 0.1; else lado = Math.round(lado * 0.8);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}

function idbTx(store, mode, fn){

    const tx = idb.transaction(store, mode); const st = tx.objectStore(store); let out;
    Promise.resolve(fn(st)).then((v) => { out = v; });
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}

/** Guarda (crea o actualiza) un registro. Se envía a la nube en segundo plano. */
async function put(t, rec, silencioso){
  rec._u = Date.now(); rec._d = rec._d ? 1 : 0;
  S[t].set(rec.id, rec);
  M.pend.add(t + '|' + rec.id);
  if (t === 'vta' || t === 'com' || t === 'mov' || t === 'prod') dirtyStock = true;
  await idbTx('rec', 'readwrite', (st) => { st.put({ k: t + '|' + rec.id, t, id: rec.id, v: rec }); });
  await metaSet('pend', Array.from(M.pend));
  if (!silencioso) programarSync();
  return rec;
}
async function putMuchos(t, recs){
  const now = Date.now();
  recs.forEach((rec, i) => { rec._u = now + i; rec._d = rec._d ? 1 : 0; S[t].set(rec.id, rec); M.pend.add(t + '|' + rec.id); });
  dirtyStock = true;
  await idbTx('rec', 'readwrite', (st) => { recs.forEach((rec) => st.put({ k: t + '|' + rec.id, t, id: rec.id, v: rec })); });
  await metaSet('pend', Array.from(M.pend));
  programarSync();
}

function calcStock(){
  const st = new Map(); const add = (id, q) => st.set(id, r2((st.get(id) || 0) + q));
  S.mov.forEach((m) => { if (!m._d) add(m.p, Number(m.q) || 0); });
  S.com.forEach((c) => { if (!c._d && !c.an) (c.it || []).forEach((x) => add(x.p, Number(x.q) || 0)); });
  S.vta.forEach((v) => { if (!v._d && !v.an && v.tp !== 'P') (v.it || []).forEach((x) => add(x.p, -(Number(x.q) || 0))); });
  STOCK = st; dirtyStock = false;
}

function calcItem(x){
  const bruto = (Number(x.pu) || 0) * (Number(x.q) || 0);
  const desc = bruto - bruto * (1 - (Number(x.d) || 0) / 100) * (1 - (Number(x.dg) || 0) / 100);
  const neto = bruto - desc;
  const tasa = Number(x.iva) || 0;
  const base = tasa ? neto / (1 + tasa / 100) : neto;
  return { bruto, desc, neto, base, iva: neto - base, tasa };
}
function totales(items){
  const t = { sub12: 0, sub0: 0, desc: 0, iva: 0, total: 0, costo: 0, unid: 0 }; const tasas = {};
  (items || []).forEach((x) => {
    const c = calcItem(x);
    if (c.tasa) t.sub12 += c.base; else t.sub0 += c.base;
    const o = tasas[c.tasa] || (tasas[c.tasa] = { b: 0, i: 0 }); o.b += c.base; o.i += c.iva;
    t.desc += c.desc; t.iva += c.iva; t.total += c.neto; t.unid += Number(x.q) || 0;
    t.costo += (Number(x.co) || 0) * (Number(x.q) || 0);
  });
  Object.keys(t).forEach((k) => { t[k] = r2(t[k]); });
  t.util = r2((t.sub12 + t.sub0) - t.costo);
  Object.keys(tasas).forEach((k) => { tasas[k] = { b: r2(tasas[k].b), i: r2(tasas[k].i) }; });
  t.tasas = tasas;
  return t;
}
/** Desglose: subtotal por tarifa de IVA, descuento, IVA y total (para pantalla) */
function desgloseHTML(t, grande){
  const ts = t.tasas || totales(t.it || []).tasas || {};
  const filas = Object.keys(ts).map(Number).sort((a, b) => b - a).map((k) => '<div><span>Subtotal ' + k + '%</span><b>' + money(ts[k].b) + '</b></div>').join('');
  const ivas = Object.keys(ts).map(Number).filter((k) => k).sort((a, b) => b - a).map((k) => '<div><span>IVA ' + k + '%</span><b>' + money(ts[k].i) + '</b></div>').join('');
  return '<div class="totbox">' + (filas || '<div><span>Subtotal</span><b>$0.00</b></div>') + (t.desc ? '<div><span>Descuentos (incluidos)</span><b>−' + money(t.desc) + '</b></div>' : '') +

}

let syncTimer, syncEnCurso = false, syncError = '', ultimoSync = 0;
function programarSync(ms){ clearTimeout(syncTimer); if (M.nube && M.nube.url) syncTimer = setTimeout(() => sincronizar(), ms == null ? 1500 : ms); pintarSync(); }
async function llamarNube(body){
  const r = await fetch(M.nube.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
  if (!r.ok) throw new Error('La nube respondió con error ' + r.status);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'Error en la nube');
  return d;
}
async function sincronizar(manual){
  if (!M.nube || !M.nube.url) { if (manual) toast('Primero conecta la nube en Ajustes.', true); return false; }
  if (syncEnCurso) return false;
  if (!navigator.onLine) { syncError = 'Sin internet'; pintarSync(); if (manual) toast('Sin internet. Los datos se enviarán cuando vuelva la conexión.', true); return false; }
  syncEnCurso = true; syncError = ''; pintarSync();
  let recibidos = 0;
  try {
    let vueltas = 0, more = true;
    while ((M.pend.size || more) && vueltas < 40) {
      vueltas++;
      // lotes de hasta 350 registros o ~1,5 MB (las fotos pesan más)
      const claves = []; let peso = 0;
      for (const k of M.pend) { if (claves.length >= 350 || peso > 1500000) break; claves.push(k); const i = k.indexOf('|'); const v = S[k.slice(0, i)] && S[k.slice(0, i)].get(k.slice(i + 1)); peso += v && v.d ? v.d.length : 300; }
      const push = claves.map((k) => {
        const i = k.indexOf('|'); const t = k.slice(0, i), id = k.slice(i + 1); const v = S[t] && S[t].get(id);
        return v ? { t, id, u: v._u || 0, d: v._d ? 1 : 0, j: JSON.stringify(v) } : null;
      }).filter(Boolean);
      const sentU = {}; push.forEach((p) => { sentU[p.t + '|' + p.id] = p.u; });
      const d = await llamarNube({ k: M.nube.clave, since: M.rev, push, dev: M.dev });
      // lo enviado ya está en la nube (si no cambió mientras tanto)
      claves.forEach((k) => { const i = k.indexOf('|'); const v = S[k.slice(0, i)].get(k.slice(i + 1)); if (!v || v._u === sentU[k]) M.pend.delete(k); });
      const guardar = [];
      (d.rows || []).forEach((row) => {
        if (!S[row.t]) return;
        const k = row.t + '|' + row.id; const local = S[row.t].get(row.id);
        if (M.pend.has(k) && local && (local._u || 0) > row.u) return;   // lo local es más nuevo
        let v; try { v = JSON.parse(row.j); } catch (e) { return; }
        v._u = row.u; v._d = row.d;
        S[row.t].set(row.id, v); M.pend.delete(k); guardar.push({ k, t: row.t, id: row.id, v }); recibidos++;
      });
      if (guardar.length) { await idbTx('rec', 'readwrite', (st) => { guardar.forEach((g) => st.put(g)); }); dirtyStock = true; }
      M.rev = d.rev || M.rev; more = !!d.more;
      await metaSet('rev', M.rev); await metaSet('pend', Array.from(M.pend));
      if (!more && !M.pend.size) break;
    }
    ultimoSync = Date.now(); ls.set('ultimoSync', ultimoSync);
    if (manual) toast(recibidos ? 'Sincronizado: ' + recibidos + ' cambios recibidos.' : 'Todo sincronizado.');
    if (recibidos) document.dispatchEvent(new CustomEvent('datos-nube'));
    return true;
  } catch (e) {
    syncError = e.message || 'Error de conexión';
    if (manual) toast('No se pudo sincronizar: ' + syncError, true);
    return false;
  } finally { syncEnCurso = false; pintarSync(); }
}
function pintarSync(){
  const dot = $('syncDot'), txt = $('syncTxt'); if (!dot) return;
  let c = '', t = 'Sin nube';
  if (M.nube && M.nube.url) {
    if (syncEnCurso) { c = 'run'; t = 'Sincronizando…'; }
    else if (syncError) { c = 'err'; t = M.pend.size ? M.pend.size + ' por enviar' : 'Sin conexión'; }
    else if (M.pend.size) { c = 'pend'; t = M.pend.size + ' por enviar'; }
    else { c = 'ok'; t = 'En la nube'; }
  } else if (M.pend.size) t = 'Solo este equipo';
  dot.className = 'dot ' + c; txt.textContent = t;
  const sn = $('syncNow'); if (sn) sn.classList.toggle('run', !!syncEnCurso);
}

    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (h5) { try { await h5.stop(); } catch (e) {} }
    ov.remove(); SCAN = null; if (opts.onClose) opts.onClose();
  };
  SCAN = { cerrar };
  const recibir = (code) => {
    code = String(code || '').trim(); if (!code) return;
    const now = Date.now(); if (code === last && now - lastT < 1600) return;
    last = code; lastT = now;
    const res = onCode(code);
    const msg = (res && res.msg) || code; $('scLast').textContent = msg;
    beep(res ? res.ok !== false : true);
    if (!opts.continuo && res && res.ok !== false) cerrar();
  };
  $('scClose').onclick = cerrar; $('scOk').onclick = () => { const v = $('scMan').value.trim(); if (v) { recibir(v); $('scMan').value = ''; } else cerrar(); };
  $('scMan').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('scOk').click(); } });
  try {
    if ('BarcodeDetector' in window) {
      const fmts = await BarcodeDetector.getSupportedFormats();
      const det = new BarcodeDetector({ formats: fmts.filter((f) => f !== 'unknown') });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream; await video.play();
      const loop = async () => {
        if (!alive) return;
        try { if (video.readyState >= 2) { const r = await det.detect(video); if (r && r[0]) recibir(r[0].rawValue); } } catch (e) {}
        setTimeout(() => { raf = requestAnimationFrame(loop); }, 120);
      };
      loop();
    } else {
      video.remove(); qs('.frame', ov).remove();
      const box = document.createElement('div'); box.id = 'scanFallback'; ov.insertBefore(box, qs('.bar', ov));
      await cargarScript(LIB.qr);
      h5 = new window.Html5Qrcode('scanFallback', { verbose: false });
      await h5.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, hh) => ({ width: Math.floor(w * 0.84), height: Math.floor(Math.min(hh, w) * 0.42) }) }, (txt) => recibir(txt), () => {});
    }
  } catch (e) {
    $('scLast').textContent = 'No se pudo abrir la cámara. Permite el acceso a la cámara o escribe el código abajo.';
  }
}

/* ---------- Buscador de productos reutilizable ---------- */
function buscarProductos(q, lim){
  const w = norm(q).split(' ').filter(Boolean); if (!w.length) return [];
  const out = []; const qn = norm(q);
  for (const p of S.prod.values()) {
    if (p._d) continue;
    if (p.id === q || (p.b && p.b === q)) { out.unshift(p); continue; }
    const hay = p._h || (p._h = norm(p.id + ' ' + (p.b || '') + ' ' + p.n + ' ' + (p.m || '') + ' ' + (p.c || '')));
    if (w.every((x) => hay.indexOf(x) >= 0)) out.push(p);
    if (out.length > 400) break;
  }
  out.sort((a, b) => { const ai = norm(a.n).startsWith(qn) ? 0 : 1, bi = norm(b.n).startsWith(qn) ? 0 : 1; return ai - bi; });
  return out.slice(0, lim || 40);
}
function porCodigo(code){
  code = String(code).trim(); if (!code) return null;
  const p = S.prod.get(code); if (p && !p._d) return p;
  for (const x of S.prod.values()) if (!x._d && x.b && (x.b === code || (x.b2 && x.b2.split(',').includes(code)))) return x;
  // códigos EAN con ceros iniciales
  const sin = code.replace(/^0+/, '');
  for (const x of S.prod.values()) if (!x._d && ((x.b && x.b.replace(/^0+/, '') === sin) || x.id.replace(/^0+/, '') === sin)) return x;
  return null;
}
function chipStock(p){
  const s = stockDe(p.id); const mi = Number(p.mi) || 0;
  return '<span class="stockchip ' + (s <= 0 ? 'no' : (mi && s <= mi ? 'lo' : '')) + '">Stock ' + numf(s) + '</span>';
}
/** Monta un buscador con resultados desplegables. onPick(producto) */
function montarBuscador(cont, onPick, opts){
  opts = opts || {};
  cont.innerHTML = '<div class="searchbar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + IC.search + '</svg>' +
    '<input class="in grow" type="search" placeholder="' + h(opts.ph || 'Buscar o escanear…') + '" autocomplete="off" enterkeyhint="search">' +
    '<button class="btn c3d ca icon" type="button" aria-label="Escanear con cámara">' + ic('scan') + '</button><div class="results hide"></div></div>';
  const inp = qs('input', cont), res = qs('.results', cont), btn = qs('button', cont);
  let lista = [], sel = 0;
  const pintar = () => {
    if (!lista.length) { res.innerHTML = inp.value.trim() ? '<div class="empty small">Sin resultados. Si es un código nuevo, regístralo en Inventario.</div>' : ''; res.classList.toggle('hide', !inp.value.trim()); return; }
    res.innerHTML = lista.map((p, i) => '<div class="res ' + (i === sel ? 'sel' : '') + '" data-i="' + i + '">' + thumb(p) + '<div class="grow"><div class="t">' + h(p.n) + '</div><div class="s">' + h(p.id) + (p.b ? ' · ' + h(p.b) : '') + (p.m ? ' · ' + h(p.m) : '') + ' ' + chipStock(p) + '</div></div><div class="p">' + money(p.pv) + '</div></div>').join('');
    res.classList.remove('hide');
  };
  const elegir = (p) => { onPick(p); inp.value = ''; lista = []; res.classList.add('hide'); if (opts.keepFocus !== false && matchMedia('(pointer:fine)').matches) inp.focus(); };
  let tmr;
  inp.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { lista = buscarProductos(inp.value, 40); sel = 0; pintar(); }, 120); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, lista.length - 1); pintar(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); pintar(); e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const exacto = porCodigo(inp.value);      // lector de código de barras USB/Bluetooth
      if (exacto) { beep(true); elegir(exacto); return; }
      lista = buscarProductos(inp.value, 40);
      if (lista[sel]) elegir(lista[sel]); else if (inp.value.trim() && opts.onUnknown) { opts.onUnknown(inp.value.trim()); inp.value = ''; res.classList.add('hide'); }
    } else if (e.key === 'Escape') { res.classList.add('hide'); }
  });
  res.addEventListener('click', (e) => { const d = e.target.closest('[data-i]'); if (d) elegir(lista[+d.dataset.i]); });
  document.addEventListener('click', (e) => { if (!cont.contains(e.target)) res.classList.add('hide'); });
  btn.onclick = () => escanear((code) => {
    const p = porCodigo(code);
    if (p) { onPick(p); return { msg: '✓ ' + p.n + ' · ' + money(p.pv) }; }
    if (opts.onUnknown) { if (!opts.continuo) { SCAN && SCAN.cerrar(); opts.onUnknown(code); } return { ok: false, msg: 'Código ' + code + ' no registrado' }; }
    return { ok: false, msg: 'Código ' + code + ' no registrado' };
  }, { continuo: opts.continuo !== false, titulo: opts.scanTitulo });
  return { inp };
}

let CART = ls.get('carrito', null);
function cartNuevo(){ return { it: [], cli: null, tp: 'F', fp: 'ef', pedId: null, editId: null, nota: '' }; }
if (!CART || !Array.isArray(CART.it)) CART = cartNuevo();
const guardarCart = () => ls.set('carrito', CART);

/** Cantidad total de un producto en el carrito (puede estar en varias líneas) */
const totalEnCarrito = (pid) => CART.it.filter((y) => y.p === pid).reduce((t, y) => t + (Number(y.q) || 0), 0);
/** Aviso cuando se pide más de lo que hay (solo si no se permite vender sin stock) */
/** No deja poner más de lo que hay en stock: ajusta la cantidad y avisa con un recuadro.
    (Al editar un pedido guardado no se limita, porque el pedido puede esperar mercadería.) */
function avisoStock(pid, linea){
  if (cfg().sinStock || CART.editId) return false;
  const s = Math.max(0, stockDe(pid)), q = totalEnCarrito(pid);
  if (q <= s) return false;
  let exceso = r2(q - s);
  const lineas = linea ? [linea].concat(CART.it.filter((y) => y.p === pid && y !== linea)) : CART.it.filter((y) => y.p === pid);
  lineas.forEach((y) => { if (exceso <= 0) return; const quita = Math.min(Number(y.q) || 0, exceso); y.q = r2((Number(y.q) || 0) - quita); exceso = r2(exceso - quita); });
  CART.it = CART.it.filter((y) => !(y.p === pid && !(Number(y.q) > 0)));
  guardarCart();
  const p = S.prod.get(pid) || { n: pid };
  alerta(s > 0 ? 'Solo hay ' + numf(s) + ' en stock' : 'Sin stock', s > 0 ? 'Del producto <b>' + h(p.n) + '</b> solo hay <b>' + numf(s) + '</b> en stock.<br>La cantidad quedó en <b>' + numf(s) + '</b>.'
    : 'Del producto <b>' + h(p.n) + '</b> no hay stock (0). No se puede agregar a la venta.');
  return true;
}
function agregarAlCarrito(p, q){
  q = q || 1;
  const ex = CART.it.find((x) => x.p === p.id && !Number(x.d));
  if (ex) ex.q = r2(Number(ex.q) + q);
  else CART.it.unshift({ p: p.id, n: p.n, pu: Number(p.pv) || 0, q, d: 0, iva: p.iva == null ? cfg().iva : Number(p.iva), co: Number(p.co) || 0 });
  guardarCart(); avisoStock(p.id, ex || CART.it[0]);
}

function siguienteNumero(tp, pto){
  const C = cfg(); pto = pad(pto || '001', 3);
  const pref = tp === 'F' ? pad(C.estab || '001', 3) + '-' + pto + '-' : ({ N: 'NV-', C: 'NC-', P: 'PD-' }[tp] || 'PD-') + pto + '-';
  let max = 0;
  S.vta.forEach((v) => { if (!v.anf && v.tp === tp && v.num && v.num.startsWith(pref)) { const n = parseInt(v.num.slice(pref.length), 10); if (n > max) max = n; } });
  return pref + pad(max + 1, tp === 'F' ? 9 : 6);
}

}
/** Crea o actualiza el cliente escrito en Cobrar. Devuelve los datos para el documento. */
async function guardarClienteVenta(c){
  if (!c) return null;
  const d = { ruc: String(c.ruc || '').replace(/\D/g, ''), nombre: String(c.nombre || '').trim().toUpperCase(), tel: String(c.tel || '').trim(), correo: String(c.correo || '').trim(), dir: String(c.dir || '').trim() };
  if (d.ruc === CONSUMIDOR.ruc) return null;
  if (d.ruc && !/^\d{10}(\d{3})?$/.test(d.ruc)) throw new Error('La cédula tiene 10 dígitos y el RUC 13.');
  if (!d.nombre) throw new Error('Escribe el nombre del cliente.');
  if (d.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.correo)) throw new Error('El correo no es válido.');
  let rec = (c.id && S.cli.get(c.id)) || (d.ruc && vivos('cli').find((x) => x.ruc === d.ruc)) || null;
  if (rec) {
    const cambia = ['ruc', 'nombre', 'tel', 'correo', 'dir'].some((k) => d[k] && d[k] !== (rec[k] || ''));
    rec = Object.assign({}, rec, Object.fromEntries(Object.entries(d).filter(([, v]) => v)), { _d: 0 });
    if (cambia) await put('cli', rec);
  } else { rec = Object.assign({ id: uid('cl') }, d); await put('cli', rec); }
  return { id: rec.id, ruc: rec.ruc, nombre: rec.nombre, tel: rec.tel, correo: rec.correo, dir: rec.dir };
}

async function guardarVenta(o){
  const t = totales(CART.it);

  const v = editando ? Object.assign({}, editando) : { id: uid('vt'), tp: o.tp, num: siguienteNumero(o.tp, USR.pto), f: hoyISO(), ts: Date.now(), v: USR.id, ab: [] };
  Object.assign(v, { cli: o.cli || null, it: CART.it.map((x) => ({ p: x.p, n: x.n, q: Number(x.q), pu: Number(x.pu), d: Number(x.d) || 0, dg: Number(x.dg) || 0, iva: Number(x.iva) || 0, co: Number(x.co) || 0 })),
    fp: o.fp, ref: o.ref || '', rec: o.rec || 0, pl: o.fp === 'cr' ? o.pl : 0, venc: o.fp === 'cr' ? sumarDias(v.f, o.pl || 30) : '', sri: o.sri || '', nota: o.nota || '',
    sub12: t.sub12, sub0: t.sub0, iva: t.iva, desc: t.desc, tot: t.total, costo: t.costo, tasas: t.tasas });
  if (CART.pedId && o.tp !== 'P') v.ped = CART.pedId;

/** Carga un documento en la pantalla de venta (convertir/editar/duplicar pedido) */
function cargarEnVenta(doc, modo){
  CART = cartNuevo();
  CART.it = (doc.it || []).map((x) => Object.assign({}, x));
  CART.cli = doc.cli || null; CART.fp = doc.fp || 'ef'; CART.nota = doc.nota || '';
  if (modo === 'convertir') { CART.pedId = doc.id; CART.tp = 'F'; }
  if (modo === 'editar') { CART.editId = doc.id; CART.tp = 'P'; }
  if (modo === 'duplicar') { CART.tp = doc.tp; }
  // actualiza precios al valor actual si se convierte o duplica
  if (modo !== 'editar') CART.it.forEach((x) => { const p = S.prod.get(x.p); if (p && !p._d) { x.co = Number(p.co) || x.co; } });
  guardarCart(); irA('vender');
}

const PERIODOS = { hoy: 'Hoy', ayer: 'Ayer', sem: 'Últimos 7 días', mes: 'Este mes', mesAnt: 'Mes anterior', anio: 'Este año', todo: 'Todo', rango: 'Rango de fechas' };
function rangoPeriodo(p, d1, d2){
  const hoy = hoyISO(); const d = new Date();
  switch (p) {
    case 'hoy': return [hoy, hoy];
    case 'ayer': { const a = sumarDias(hoy, -1); return [a, a]; }
    case 'sem': return [sumarDias(hoy, -6), hoy];
    case 'mes': return [hoy.slice(0, 8) + '01', hoy];
    case 'mesAnt': { const a = new Date(d.getFullYear(), d.getMonth() - 1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); return [fechaISO(a), fechaISO(b)]; }
    case 'anio': return [hoy.slice(0, 4) + '-01-01', hoy];
    case 'rango': return [d1 || hoy, d2 || hoy];
    default: return ['0000-00-00', '9999-12-31'];
  }
}
/** Selector de período + vendedor. Guarda la elección. onChange({desde,hasta,vend,txt}) */
function filtroPeriodo(cont, clave, onChange, conVend){
  const st = ls.get('f.' + clave, { p: 'hoy', d1: hoyISO(), d2: hoyISO(), v: '' });
  const vendOpts = esAdmin() || puede('rep') ? '<option value="">Todos los vendedores</option>' + vivos('vend').map((v) => '<option value="' + h(v.id) + '">' + h(v.nombre) + '</option>').join('') : '';
  cont.innerHTML = '<div class="row"><select class="in" id="fp_' + clave + '" style="width:auto;flex:1 1 160px">' + Object.keys(PERIODOS).map((k) => '<option value="' + k + '">' + PERIODOS[k] + '</option>').join('') + '</select>' +
    '<span class="row hide" id="fr_' + clave + '" style="flex:1 1 280px"><input class="in" type="date" id="f1_' + clave + '" style="flex:1"><input class="in" type="date" id="f2_' + clave + '" style="flex:1"></span>' +
    (conVend && vendOpts ? '<select class="in" id="fv_' + clave + '" style="width:auto;flex:1 1 160px">' + vendOpts + '</select>' : '') + '</div>';
  const sp = $('fp_' + clave), f1 = $('f1_' + clave), f2 = $('f2_' + clave), fv = $('fv_' + clave);
  sp.value = st.p; f1.value = st.d1; f2.value = st.d2; if (fv) fv.value = st.v || '';
  const emitir = () => {
    st.p = sp.value; st.d1 = f1.value; st.d2 = f2.value; st.v = fv ? fv.value : ''; ls.set('f.' + clave, st);
    $('fr_' + clave).classList.toggle('hide', st.p !== 'rango');
    const [desde, hasta] = rangoPeriodo(st.p, st.d1, st.d2);
    const vend = (esAdmin() || puede('rep')) ? st.v : USR.id;
    onChange({ desde, hasta, vend, txt: st.p === 'rango' ? fechaTxt(desde) + ' al ' + fechaTxt(hasta) : PERIODOS[st.p] + (st.p === 'todo' ? '' : ' (' + (desde === hasta ? fechaTxt(desde) : fechaTxt(desde) + ' – ' + fechaTxt(hasta)) + ')') });
  };
  [sp, f1, f2, fv].forEach((x) => x && x.addEventListener('change', emitir));
  emitir();
}

    '<div class="card ctot" id="ncTot" style="margin-top:12px"></div>',
    foot: '<button class="btn" data-x>Cancelar</button><button class="btn c3d cr" id="ncOk">' + ic('check') + 'Guardar nota de crédito</button>' });
  const pintar = () => {
    m.q('#ncB').innerHTML = lin.map((x, i) => '<tr data-i="' + i + '"><td>' + h(x.n) + '<div class="small muted">' + h(x.p) + ' · ' + money(x.pu) + ' c/u</div></td><td class="n">' + numf(x.q) + '</td><td class="n">' + numf(x.max) + '</td>' +
      '<td class="n"><input class="mini pct" data-q inputmode="decimal" value="' + (x.dq || '') + '" placeholder="0"' + (x.max > 0 ? '' : ' disabled') + '></td><td class="n">' + money(calcItem(Object.assign({}, x, { q: x.dq })).neto) + '</td></tr>').join('');
    const t = totales(lin.filter((x) => x.dq > 0).map((x) => Object.assign({}, x, { q: x.dq })));
    m.q('#ncTot').innerHTML = desgloseHTML(t);
  };
  m.q('#ncB').onchange = (e) => { const tr = e.target.closest('[data-i]'); if (!tr) return; const x = lin[+tr.dataset.i];
    let q = parseFloat(String(e.target.value).replace(',', '.')) || 0; q = Math.max(0, Math.min(x.max, q)); x.dq = q; pintar(); };
  m.q('#ncTodo').onclick = () => { lin.forEach((x) => { x.dq = Math.max(0, x.max); }); pintar(); };
  m.q('#ncNada').onclick = () => { lin.forEach((x) => { x.dq = 0; }); pintar(); };
  m.q('#ncOk').onclick = async () => {
    const it = lin.filter((x) => x.dq > 0).map((x) => ({ p: x.p, n: x.n, q: -x.dq, pu: x.pu, d: x.d || 0, dg: x.dg || 0, iva: x.iva || 0, co: x.co || 0 }));
    if (!it.length) return toast('Escribe la cantidad que devuelve el cliente.', true);
    const t = totales(it); const fp = m.q('#ncFp').value;
    const nc = { id: uid('nc'), tp: 'C', num: siguienteNumero('C', USR.pto), f: hoyISO(), ts: Date.now(), v: USR.id, cli: v.cli || null, it, fp, mot: m.q('#ncMot').value, nota: m.q('#ncNota').value.trim(),
      vref: v.id, vrefNum: v.num, sub12: t.sub12, sub0: t.sub0, iva: t.iva, desc: t.desc, tot: t.total, costo: t.costo, tasas: t.tasas, ab: [] };
    await put('vta', nc);
    if (fp === 'ab') { const o = S.vta.get(v.id); const val = Math.min(saldo(o), Math.abs(nc.tot));
      if (val > 0) { o.ab = (o.ab || []).concat([{ id: uid('a'), f: hoyISO(), m: r2(val), fp: 'nc', ref: nc.num, nc: nc.id, v: USR.id, ts: Date.now() }]); await put('vta', o); } }
    m.close(); toast('Nota de crédito ' + nc.num + ' guardada. El stock regresó al inventario.'); render(); verDocumento(nc);
  };
  pintar();
}

const categorias = () => Array.from(new Set(vivos('prod').map((p) => p.c).filter(Boolean))).sort((a, b) => a.localeCompare(b));

  v.innerHTML = '<div class="pagehead"><h2>Inventario</h2>' + '<button class="btn sm c3d ca" id="iEtq">' + ic('barcode') + 'Etiquetas</button>' + (puede('prod') ? '<button class="btn sm c3d cv" id="iNuevo">' + ic('plus') + 'Producto</button>' : '') + '</div>' +
    '<div class="tabs" id="iTabs"><button data-t="prod">Productos y stock</button>' + (puede('inv') ? '<button data-t="conteo">Conteo con escáner</button><button data-t="mov">Ajustes de stock</button>' : '') + '</div><div id="iBody"></div>';

function invProductos(){
  const b = $('iBody');
  if (!vivos('prod').length) {
    b.innerHTML = '<div class="card empty"><b>Aún no hay productos</b>' + (puede('prod') ? 'Carga los productos del Catálogo MASS o importa tu lista de Anfibus en Excel.' +
      '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" id="iSeed">' + ic('download') + 'Cargar productos del Catálogo MASS</button><a class="btn" href="#excel">' + ic('sheet') + 'Importar Excel</a></div>' : 'Pide al administrador que cargue los productos o sincroniza con la nube.') + '</div>';
    if ($('iSeed')) $('iSeed').onclick = cargarCatalogoInicial;
    return;
  }
  const cats = categorias();
  b.innerHTML = '<div class="stack"><div class="searchbar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + IC.search + '</svg>' +
    '<input class="in grow" id="pQ" type="search" placeholder="Buscar nombre, código o código de barras"><button class="btn pri icon" id="pScan" aria-label="Escanear">' + ic('scan') + '</button></div>' +
    '<div class="row"><select class="in" id="pCat" style="flex:1 1 180px;width:auto"><option value="">Todas las categorías</option>' + cats.map((c) => '<option>' + h(c) + '</option>').join('') + '</select>' +
    '<select class="in" id="pFil" style="flex:1 1 180px;width:auto"><option value="">Todos</option><option value="bajo">Stock bajo el mínimo</option><option value="cero">Sin stock (0 o menos)</option><option value="neg">Stock negativo</option><option value="con">Con stock</option><option value="sinb">Sin código de barras</option><option value="sinc">Sin costo</option></select></div>' +
    '<div class="small muted" id="pRes"></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Código</th><th>Producto</th><th class="n">Stock</th><th class="n">PVP</th>' + (puede('prod') ? '<th class="n">Costo</th>' : '') + '</tr></thead><tbody id="pBody"></tbody></table></div>' +
    '<button class="btn hide" id="pMas">Ver más</button></div>';
  let lim = 150;
  const filtrar = () => {
    const w = norm($('pQ').value).split(' ').filter(Boolean), cat = $('pCat').value, fil = $('pFil').value;
    let l = vivos('prod').filter((p) => {
      if (cat && p.c !== cat) return false;
      if (w.length) { const hay = p._h || (p._h = norm(p.id + ' ' + (p.b || '') + ' ' + p.n + ' ' + (p.m || '') + ' ' + (p.c || ''))); if (!w.every((x) => hay.includes(x))) return false; }
      if (fil) { const s = stockDe(p.id);
        if (fil === 'bajo' && !(Number(p.mi) > 0 && s <= Number(p.mi))) return false;
        if (fil === 'cero' && s > 0) return false; if (fil === 'neg' && s >= 0) return false; if (fil === 'con' && s <= 0) return false;
        if (fil === 'sinb' && p.b) return false; if (fil === 'sinc' && Number(p.co) > 0) return false; }
      return true;
    });
    l.sort((a, b) => a.n.localeCompare(b.n));
    $('pRes').textContent = l.length + ' productos';
    $('pBody').innerHTML = l.slice(0, lim).map((p) => { const s = stockDe(p.id);
      return '<tr class="click" data-id="' + h(p.id) + '"><td>' + h(p.id) + (p.b ? '<div class="small muted">' + h(p.b) + '</div>' : '') + '</td><td><div class="pcell">' + thumb(p, 'sm') + '<div>' + h(p.n) + '<div class="small muted">' + h([p.m, p.c].filter(Boolean).join(' · ')) + '</div></div></div></td>' +
        '<td class="n"><span class="stockchip ' + (s <= 0 ? 'no' : (Number(p.mi) && s <= Number(p.mi) ? 'lo' : '')) + '">' + numf(s) + '</span></td><td class="n">' + money(p.pv) + '</td>' + (puede('prod') ? '<td class="n">' + (Number(p.co) ? money(p.co) : '—') + '</td>' : '') + '</tr>'; }).join('') ||
      '<tr><td colspan="5" class="center muted">Sin resultados</td></tr>';
    $('pMas').classList.toggle('hide', l.length <= lim);
  };
  let t; $('pQ').oninput = () => { clearTimeout(t); t = setTimeout(() => { lim = 150; filtrar(); }, 150); };
  $('pCat').onchange = $('pFil').onchange = () => { lim = 150; filtrar(); };
  $('pMas').onclick = () => { lim += 300; filtrar(); };
  $('pBody').onclick = (e) => { const r = e.target.closest('[data-id]'); if (r) editarProducto(S.prod.get(r.dataset.id)); };
  $('pScan').onclick = () => escanear((code) => {
    const p = porCodigo(code);
    if (p) { setTimeout(() => editarProducto(p), 50); return { msg: p.n }; }
    setTimeout(() => codigoDesconocido(code, () => filtrar()), 50); return { msg: 'Código nuevo: ' + code };
  }, { continuo: false });
  filtrar();
}

async function cargarCatalogoInicial(){
  try {
    const r = await fetch('catalogo.json', { cache: 'no-cache' }); const d = await r.json();
    const cats = d.c || [];
    const recs = (d.p || []).filter((x) => !S.prod.has(String(x[0]))).map((x) => ({ id: String(x[0]), n: x[1], m: x[2] || '', c: cats[x[4]] || '', pv: Number(x[3]) || 0, co: 0, iva: cfg().iva, mi: 0, b: '', un: 'UND' }));
    if (!recs.length) return toast('Los productos ya estaban cargados.');
    await putMuchos('prod', recs); toast(recs.length + ' productos cargados.'); render();
  } catch (e) { toast('No se pudo leer catalogo.json: ' + e.message, true); }
}

/** Un código escaneado que no existe: asignarlo a un producto o crear uno nuevo */
function codigoDesconocido(code, onDone){
  if (!puede('prod') && !puede('inv')) return toast('El código ' + code + ' no está registrado.', true);
  const m = modal({ title: 'Código ' + code, body: '<p style="margin-top:0">Este código de barras no está registrado. Búscalo para asignarlo a un producto existente, o crea uno nuevo.</p><div id="cdBus"></div>',
    foot: '<button class="btn" data-x>Cancelar</button>' + (puede('prod') ? '<button class="btn pri" id="cdNuevo">' + ic('plus') + 'Crear producto nuevo</button>' : '') });
  montarBuscador(m.q('#cdBus'), async (p) => {
    if (p.b && p.b !== code) { p.b2 = Array.from(new Set(((p.b2 || '') + ',' + code).split(',').filter(Boolean))).join(','); } else p.b = code;
    delete p._h; await put('prod', p); m.close(); toast('Código asignado a ' + p.n); if (onDone) onDone(p);
  }, { ph: 'Buscar el producto por nombre…', continuo: false });
  if (m.q('#cdNuevo')) m.q('#cdNuevo').onclick = () => { m.close(); editarProducto(null, { b: code }, onDone); };
}

    '<datalist id="dlCat">' + categorias().map((c) => '<option value="' + h(c) + '">').join('') + '</datalist>' +
    '<div class="grid2"><label class="f">Código interno (Anfibus)<input class="in" id="epId" value="' + h(p.id) + '"' + (nuevo ? '' : ' disabled') + ' placeholder="Ej.: 11103"></label>' +
    '<label class="f">Código de barras<div class="row" style="flex-wrap:nowrap"><input class="in grow" id="epB" value="' + h(p.b || '') + '" inputmode="numeric"' + (ed || puede('inv') ? '' : ' disabled') + '>' + (ed || puede('inv') ? '<button class="btn icon" id="epScan" type="button">' + ic('scan') + '</button>' : '') + '</div></label></div>' +

    (p.b2 ? '<p class="small muted">Otros códigos de barras: ' + h(p.b2) + '</p>' : ''),
    foot: '<button class="btn" data-x>Cerrar</button>' + (!nuevo ? '<button class="btn" id="epKx">' + ic('doc') + 'Kárdex</button>' : '') +

    const st = m.q('#epSt') ? parseFloat(m.q('#epSt').value) : 0;

function ajustarStock(p, onDone){
  const s = stockDe(p.id);
  const m = modal({ title: 'Ajustar stock', body: '<p style="margin-top:0"><b>' + h(p.n) + '</b><br><span class="muted">Stock en el sistema: <b>' + numf(s) + '</b></span></p>' +
    '<div class="seg" id="ajMod"><button data-v="set" class="on">Cantidad real contada</button><button data-v="add">Sumar / restar</button></div>' +
    '<div class="grid2" style="margin-top:10px"><label class="f" id="ajLbl">Cantidad real<input class="in" id="ajQ" inputmode="decimal" autofocus></label>' +
    '<label class="f">Motivo<select class="in" id="ajMot"><option>Conteo físico</option><option>Producto dañado</option><option>Pérdida / robo</option><option>Devolución de cliente</option><option>Devolución a proveedor</option><option>Consumo interno</option><option>Stock inicial</option><option>Corrección</option></select></label></div>' +
    '<p class="small muted" id="ajPrev"></p>', foot: '<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ajOk">Guardar ajuste</button>' });
  let modo = 'set';
  const prev = () => { const q = parseFloat(m.q('#ajQ').value.replace(',', '.')); if (isNaN(q)) { m.q('#ajPrev').textContent = ''; return null; }
    const diff = modo === 'set' ? r2(q - s) : q; m.q('#ajPrev').textContent = 'Movimiento: ' + (diff > 0 ? '+' : '') + numf(diff) + ' → nuevo stock ' + numf(r2(s + diff)); return diff; };
  m.q('#ajMod').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; modo = b.dataset.v; qsa('#ajMod button', m.el).forEach((x) => x.classList.toggle('on', x === b)); m.q('#ajLbl').firstChild.textContent = modo === 'set' ? 'Cantidad real' : 'Cantidad (+ entra, − sale)'; prev(); };
  m.q('#ajQ').oninput = prev;
  m.q('#ajOk').onclick = async () => { const diff = prev(); if (diff == null) return toast('Escribe la cantidad.', true); if (!diff) { m.close(); return; }
    await put('mov', { id: uid('mv'), p: p.id, q: diff, tp: 'ajuste', mot: m.q('#ajMot').value, f: hoyISO(), ts: Date.now(), v: USR.id });
    m.close(); toast('Stock ajustado: ' + numf(stockDe(p.id))); if (onDone) onDone(); else render(); };
}

function movimientosDe(pid){
  const l = [];

   COMPRAS A PROVEEDORES (suman stock, actualizan costo y PVP)
   ===================================================================== */
function totCompra(it){
  const t = { sub12: 0, sub0: 0, iva: 0, tot: 0, unid: 0 }; const tasas = {};
  (it || []).forEach((x) => { const b = (Number(x.co) || 0) * (Number(x.q) || 0); const p = Number(x.iva) || 0;
    if (p) { t.sub12 += b; t.iva += b * p / 100; } else t.sub0 += b; t.unid += Number(x.q) || 0;
    const o = tasas[p] || (tasas[p] = { b: 0, i: 0 }); o.b += b; o.i += b * p / 100; });
  Object.keys(t).forEach((k) => { t[k] = r2(t[k]); }); t.tot = r2(t.sub12 + t.sub0 + t.iva);
  Object.keys(tasas).forEach((k) => { tasas[k] = { b: r2(tasas[k].b), i: r2(tasas[k].i) }; }); t.tasas = tasas; return t;
}
/** Casillas de totales de una compra */
function casillasCompra(it){
  const t = totCompra(it); const ks = Object.keys(t.tasas).map(Number).sort((a, b) => b - a);
  const c = (k, v, cls) => '<div class="tcas ' + (cls || '') + '"><span>' + k + '</span><b>' + v + '</b></div>';
  return '<div class="tcasillas">' + c('Productos', String((it || []).length)) + c('Unidades', numf(t.unid)) +
    (ks.filter((k) => k).map((k) => c('Subtotal ' + k + '%', money(t.tasas[k].b))).join('') || c('Subtotal IVA', money(0))) +
    c('Subtotal 0%', money(t.sub0)) + c('IVA', money(t.iva)) + c('TOTAL', money(t.tot), 'tot') + '</div>';
}
/* ---------- Foto de la factura (se guarda en partes para la nube) ---------- */
const PARTE = 44000;
function fotoFactura(id){
  const r = S.adj.get(id + '|0'); if (!r || r._d) return null;
  let s = r.d; for (let i = 1; i < (r.n || 1); i++) { const x = S.adj.get(id + '|' + i); if (!x || x._d) return null; s += x.d; }
  return s;
}
function comprimirFactura(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let lado = 1600, q = 0.72, out = '';
      for (let i = 0; i < 10; i++) {
        const k = Math.min(1, lado / Math.max(img.width, img.height)); const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q); if (out.length <= PARTE * 4) break;
        if (q > 0.5) q -= 0.08; else lado = Math.round(lado * 0.85);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen. Usa una foto JPG o PNG.')); };
    img.src = url;
  });
}
async function guardarFotoFactura(id, data){
  const viejo = S.adj.get(id + '|0'); const nViejo = viejo && !viejo._d ? (viejo.n || 1) : 0;
  const partes = []; for (let i = 0; i < data.length; i += PARTE) partes.push(data.slice(i, i + PARTE));
  const recs = partes.map((d, i) => ({ id: id + '|' + i, d, n: partes.length, _d: 0 }));
  for (let i = partes.length; i < nViejo; i++) recs.push({ id: id + '|' + i, d: '', _d: 1 });
  await putMuchos('adj', recs);
}
async function quitarFotoFactura(id){
  const r = S.adj.get(id + '|0'); if (!r || r._d) return;
  const recs = []; for (let i = 0; i < (r.n || 1); i++) recs.push({ id: id + '|' + i, d: '', _d: 1 });
  await putMuchos('adj', recs);
}

    '<p style="margin-top:0"><b>' + h(nomProv(c.pr)) + '</b> · ' + fechaTxt(c.f) + ' · ' + (c.fp === 'cr' ? 'Crédito ' + c.pl + ' días (vence ' + fechaTxt(c.venc) + ')' : 'Contado') + ' · registró ' + h(nomVend(c.v)) + '</p>' +
    '<div class="tblwrap"><table class="tbl"><thead><tr><th class="n">Cant.</th><th>Producto</th><th class="n">Costo</th><th class="n">IVA</th><th class="n">Subtotal</th></tr></thead><tbody>' +
    (c.it || []).map((x) => '<tr><td class="n">' + numf(x.q) + '</td><td>' + h(x.n) + '<div class="small muted">' + h(x.p) + '</div></td><td class="n">' + money(x.co) + '</td><td class="n">' + (x.iva || 0) + '%</td><td class="n">' + money(x.co * x.q) + '</td></tr>').join('') +
    '</tbody><tfoot><tr><td colspan="4">Subtotal ' + cfg().iva + '% ' + money(t.sub12) + ' · 0% ' + money(t.sub0) + ' · IVA ' + money(t.iva) + '</td><td class="n">' + money(t.tot) + '</td></tr></tfoot></table></div>' + '<div style="margin-top:10px">' + casillasCompra(c.it) + '</div>' + (ff ? '<div class="row" style="margin-top:10px"><img src="' + ff + '" alt="Factura" class="ffmini" id="vcFoto"><span class="small muted">Foto de la factura · toca para ver</span></div>' : '') + (nds.length ? '<div class="note warn" style="margin-top:10px">Notas de débito: ' + nds.map((n) => '<b>' + h(n.num || 's/n') + '</b> ' + h(n.conc || '') + ' (' + money(n.tot) + ')').join(', ') + '</div>' : '') + (c.nota ? '<p>Nota: ' + h(c.nota) + '</p>' : ''),
    foot: '<button class="btn" data-x>Cerrar</button><button class="btn" id="vcX">' + ic('sheet') + 'Excel</button><button class="btn c3d ca" id="vcEtq">' + ic('barcode') + 'Etiquetas</button>' + (!c.an && puede('compras') ? '<button class="btn c3d co" id="vcNd">' + ic('receipt') + 'Nota de débito</button>' : '') + (!c.an && esAdmin() ? '<button class="btn" id="vcEd">' + ic('edit') + 'Editar</button><button class="btn danger" id="vcAn">' + ic('x') + 'Anular</button>' : '') });
  m.q('#vcX').onclick = () => exportarFilas('Compra ' + (c.num || c.id), ['Código', 'Producto', 'Cantidad', 'Costo', 'IVA %', 'Subtotal'], (c.it || []).map((x) => [x.p, x.n, x.q, x.co, x.iva, r2(x.co * x.q)]));
  m.q('#vcEtq').onclick = () => { m.close(); imprimirEtiquetas((c.it || []).map((x) => ({ p: S.prod.get(x.p), q: x.q })), 'Etiquetas de la compra ' + (c.num || '')); };
  if (m.q('#vcEd')) m.q('#vcEd').onclick = () => { m.close(); editarCompra(c); };
  if (m.q('#vcNd')) m.q('#vcNd').onclick = () => { m.close(); notaDebito(c); };
  if (m.q('#vcFoto')) m.q('#vcFoto').onclick = () => verFotoFactura(c.id, c.num);
  if (m.q('#vcAn')) m.q('#vcAn').onclick = async () => { if (!(await confirmar('¿Anular esta compra? El stock que sumó se descuenta.', 'Anular', true))) return;
    c.an = { f: hoyISO(), v: USR.id }; await put('com', c); m.close(); toast('Compra anulada'); render(); };
}

function editarCompra(c, borr){
  const nueva = !c;
  let D = c ? JSON.parse(JSON.stringify(c)) : (borr ? JSON.parse(JSON.stringify(borr)) : { id: uid('co'), pr: '', num: '', f: hoyISO(), fp: 'co', pl: 30, it: [], nota: '', act: true });
  delete D._u; delete D._d;
  if (D.act == null) D.act = true;
  let tGuardar;
  const guardarD = () => { if (!nueva) return; clearTimeout(tGuardar); tGuardar = setTimeout(() => { if (D.pr || D.it.length || D.num) put('bor', Object.assign({}, D)); }, 600); };
  const guardarYa = async () => { clearTimeout(tGuardar); if (nueva && (D.pr || D.it.length || D.num)) await put('bor', Object.assign({}, D)); };
  const provs = () => vivos('prov').sort((a, b) => a.nombre.localeCompare(b.nombre));
  const m = modal({ title: nueva ? (borr ? 'Compra en borrador' : 'Nueva compra') : 'Editar compra ' + (c.num || ''), wide: true, sticky: true, body:
    '<div class="grid2"><label class="f">Proveedor<div class="row" style="flex-wrap:nowrap"><select class="in grow" id="ecPr"></select><button class="btn icon" id="ecPrN" type="button" aria-label="Nuevo proveedor">' + ic('plus') + '</button></div></label>' +
    '<label class="f">N° factura del proveedor<input class="in" id="ecNum" value="' + h(D.num) + '" placeholder="001-001-000012345"></label>' +
    '<label class="f">Fecha<input class="in" id="ecF" type="date" value="' + h(D.f) + '"></label>' +
    '<label class="f">Pago<div class="row" style="flex-wrap:nowrap"><select class="in" id="ecFp"><option value="co">Contado</option><option value="cr">Crédito</option></select><select class="in" id="ecPl">' + [15, 30, 45, 60, 90, 120].map((d) => '<option value="' + d + '">' + d + ' días</option>').join('') + '</select></div></label></div>' +
    '<div class="factfoto" id="ecFoto"></div>' +
    '<div style="margin:10px 0" id="ecBus"></div><div class="cart" id="ecBody" style="margin-top:0"></div><div id="ecFoot" style="margin-top:10px"></div>' +
    '<label class="chk" style="margin-top:8px"><input type="checkbox" id="ecAct"> Actualizar costo y PVP de los productos con estos valores</label>' +
    '<label class="f" style="margin-top:6px">Nota<input class="in" id="ecNota" value="' + h(D.nota || '') + '"></label>',
    foot: '<button class="btn" id="ecCan">' + (nueva ? 'Guardar borrador y salir' : 'Cancelar') + '</button>' + (nueva ? '<button class="btn danger" id="ecBor">Borrar todo</button>' : '') + '<button class="btn c3d cv" id="ecOk">' + ic('check') + 'Guardar compra</button>' });
  const pintaProv = () => { m.q('#ecPr').innerHTML = '<option value="">— Elige proveedor —</option>' + provs().map((p) => '<option value="' + h(p.id) + '">' + h(p.nombre) + '</option>').join(''); m.q('#ecPr').value = D.pr || ''; };
  pintaProv();
  m.q('#ecFp').value = D.fp; m.q('#ecPl').value = String(D.pl || 30); m.q('#ecAct').checked = D.act;
  const plVis = () => { m.q('#ecPl').style.display = m.q('#ecFp').value === 'cr' ? '' : 'none'; }; plVis();
  m.q('#ecPrN').onclick = () => editarTercero('prov', null, (p) => { D.pr = p.id; pintaProv(); guardarD(); });
  ['#ecPr', '#ecNum', '#ecF', '#ecFp', '#ecPl', '#ecAct', '#ecNota'].forEach((s2) => m.q(s2).addEventListener('change', () => {
    D.pr = m.q('#ecPr').value; D.num = m.q('#ecNum').value.trim(); D.f = m.q('#ecF').value; D.fp = m.q('#ecFp').value; D.pl = +m.q('#ecPl').value; D.act = m.q('#ecAct').checked; D.nota = m.q('#ecNota').value.trim(); plVis(); guardarD(); }));
  // foto de la factura
  const pintaFoto = () => {
    const d = fotoFactura(D.id);
    m.q('#ecFoto').innerHTML = d ? '<div class="row"><img src="' + d + '" alt="Factura" class="ffmini" id="ecFotoV"><div class="grow"><b>Foto de la factura</b><div class="small muted">Toca la imagen para verla en grande</div></div>' +
        '<label class="btn sm">' + ic('cam') + 'Cambiar<input type="file" id="ecFile" accept="image/*" hidden></label><button class="btn sm danger" id="ecFotoX" type="button">' + ic('trash') + 'Quitar</button></div>' :
      '<label class="btn c3d cb" style="width:100%">' + ic('cam') + 'Tomar o subir foto de la factura<input type="file" id="ecFile" accept="image/*" hidden></label>';
    m.q('#ecFile').onchange = async (e) => { const f = e.target.files[0]; if (!f) return;
      try { toast('Guardando foto…'); const data = await comprimirFactura(f); await guardarFotoFactura(D.id, data); D.foto = 1; await guardarYa(); pintaFoto(); toast('Foto de la factura guardada.'); } catch (err) { toast(err.message, true); } };
    if (m.q('#ecFotoV')) m.q('#ecFotoV').onclick = () => verFotoFactura(D.id, D.num || 'factura');
    if (m.q('#ecFotoX')) m.q('#ecFotoX').onclick = async () => { await quitarFotoFactura(D.id); D.foto = 0; guardarD(); pintaFoto(); };
  };
  pintaFoto();
  const nuevaLinea = (p) => ({ p: p.id, n: p.n, q: 1, co: Number(p.co) || 0, iva: p.iva == null ? cfg().iva : Number(p.iva), pvN: Number(p.pv) || 0, pvA: Number(p.pv) || 0 });
  montarBuscador(m.q('#ecBus'), (p) => {
    const ex = D.it.find((x) => x.p === p.id);
    if (ex) ex.q = r2(ex.q + 1); else D.it.unshift(nuevaLinea(p));
    guardarD(); pintar();
  }, { ph: 'Agrega productos: busca o escanea…', onUnknown: (code) => codigoDesconocido(code, (p) => { if (p) { D.it.unshift(nuevaLinea(p)); guardarD(); pintar(); } }) });
  const conIva = (x) => Math.round((Number(x.co) || 0) * (1 + (Number(x.iva) || 0) / 100) * 10000) / 10000;
  const pintar = () => {
    m.q('#ecBody').innerHTML = D.it.length ? D.it.map((x, i) => '<div class="ci" data-i="' + i + '"><div><div class="t">' + h(x.n) + '</div><div class="s">' + h(x.p) + (x.pvA ? ' · PVP actual ' + money(x.pvA) : '') + '</div></div>' +
      '<div class="tot">' + money(x.co * x.q) + '<div class="small muted" style="font-weight:400">c/IVA ' + money(conIva(x) * x.q) + '</div></div><div class="ctrl">' +
      '<label class="minilbl">Cantidad<input class="mini pct" data-k="q" inputmode="decimal" value="' + numf(x.q) + '"></label>' +
      '<label class="minilbl">Costo s/IVA<input class="mini" data-k="co" inputmode="decimal" value="' + (x.co || '') + '"></label>' +
      '<label class="minilbl">IVA' + campoIva('mini pct', 'data-k="iva"', x.iva) + '</label>' +
      '<label class="minilbl cciva">Costo c/IVA<input class="mini" data-k="coi" inputmode="decimal" value="' + (x.co ? conIva(x) : '') + '"></label>' +
      '<label class="minilbl">PVP nuevo<input class="mini" data-k="pvN" inputmode="decimal" value="' + (x.pvN || '') + '"></label>' +
      '<span class="spacer"></span><button class="btn sm icon danger" data-del aria-label="Quitar">' + ic('trash') + '</button></div></div>').join('') :
      '<div class="empty card">Agrega los productos de la factura del proveedor</div>';
    m.q('#ecFoot').innerHTML = casillasCompra(D.it);
  };
  m.q('#ecBody').onchange = (e) => { const tr = e.target.closest('[data-i]'); const k = e.target.dataset.k; if (!tr || !k) return; const x = D.it[+tr.dataset.i];
    const v = parseFloat(String(e.target.value).replace(',', '.')) || 0;
    if (k === 'coi') x.co = Math.round(v / (1 + (Number(x.iva) || 0) / 100) * 10000) / 10000; else x[k] = v;
    guardarD(); pintar(); };
  m.q('#ecBody').onclick = (e) => { if (e.target.closest('[data-del]')) { D.it.splice(+e.target.closest('[data-i]').dataset.i, 1); guardarD(); pintar(); } };
  m.q('#ecCan').onclick = async () => { await guardarYa(); m.close(); if (nueva && (D.pr || D.it.length || D.num)) toast('Compra guardada en Borradores.'); if (RUTA === 'compras') render(); };
  if (m.q('#ecBor')) m.q('#ecBor').onclick = async () => { if (await confirmar('¿Borrar este borrador de compra?', 'Borrar', true)) { clearTimeout(tGuardar); if (S.bor.has(D.id)) await borrar('bor', D.id); await quitarFotoFactura(D.id); m.close(); if (RUTA === 'compras') render(); } };
  m.q('#ecOk').onclick = async () => {
    if (!D.pr) return toast('Elige el proveedor.', true);
    if (!D.it.length) return toast('Agrega productos.', true);
    if (D.it.some((x) => !(x.q > 0))) return toast('Hay productos con cantidad 0.', true);
    clearTimeout(tGuardar);
    const t = totCompra(D.it);
    const rec = Object.assign({}, D, t, { ts: nueva ? Date.now() : c.ts, v: nueva ? USR.id : c.v, venc: D.fp === 'cr' ? sumarDias(D.f, D.pl) : '', pl: D.fp === 'cr' ? D.pl : 0, foto: fotoFactura(D.id) ? 1 : 0 });
    delete rec.act;
    await put('com', rec);
    if (D.ped && S.ped && S.ped.get(D.ped) && S.ped.get(D.ped).est !== 'rec') await put('ped', Object.assign({}, S.ped.get(D.ped), { est: 'rec', comp: rec.id, recF: hoyISO() }));
    if (D.act) {
      const cambios = [];
      D.it.forEach((x) => { const p = S.prod.get(x.p); if (!p) return; const n = Object.assign({}, p); let ch = false;
        if (x.co && x.co !== p.co) { n.co = x.co; ch = true; } if (x.pvN && x.pvN !== p.pv) { n.pv = x.pvN; ch = true; } if (Number(x.iva) !== Number(p.iva)) { n.iva = Number(x.iva); ch = true; }
        if (ch) cambios.push(n); });
      if (cambios.length) await putMuchos('prod', cambios);
    }
    if (nueva && S.bor.has(D.id)) await borrar('bor', D.id);
    m.close(); toast('Compra guardada. Stock actualizado.'); render();
  };
  pintar();
}

/* =====================================================================
   NOTA DE DÉBITO del proveedor (valor adicional a pagar por una compra)
   ===================================================================== */
function notaDebito(c, nd){
  const nuevo = !nd;
  nd = nd || { id: uid('nd'), td: 'ND', pr: c.pr, ref: c.id, refNum: c.num, num: '', f: hoyISO(), conc: 'Intereses por mora', nota: '', base: 0, ivaP: cfg().iva, fp: c.fp === 'cr' ? 'cr' : 'co', it: [] };
  const m = modal({ title: (nuevo ? 'Nota de débito' : 'Editar nota de débito') + ' · ' + nomProv(nd.pr), body:
    '<p class="small muted" style="margin-top:0">Valor adicional que el proveedor te cobra sobre la compra <b>' + h(nd.refNum || '') + '</b>. Se suma a lo que le debes y aparece en los reportes de compras.</p>' +
    '<div class="grid2"><label class="f">N° nota de débito del proveedor<input class="in" id="ndNum" value="' + h(nd.num) + '" placeholder="001-001-000000123"></label>' +
    '<label class="f">Fecha<input class="in" type="date" id="ndF" value="' + h(nd.f) + '"></label>' +
    '<label class="f">Concepto<select class="in" id="ndC">' + ['Intereses por mora', 'Flete / transporte', 'Diferencia de precio', 'Gastos bancarios', 'Cheque protestado', 'Otro'].map((o) => '<option' + (o === nd.conc ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></label>' +
    '<label class="f">Pago<select class="in" id="ndFp"><option value="cr">A crédito (se suma a la deuda)</option><option value="co">Pagada al contado</option></select></label>' +
    '<label class="f">Valor sin IVA<input class="in" id="ndB" inputmode="decimal" value="' + (nd.base || '') + '" placeholder="0.00" autofocus></label>' +
    '<label class="f">IVA %' + campoIva('in', 'id="ndI"', nd.ivaP) + '</label></div>' +
    '<label class="f" style="margin-top:10px">Detalle (opcional)<input class="in" id="ndN" value="' + h(nd.nota) + '"></label>' +
    '<div class="card ctot" id="ndT" style="margin-top:12px"></div>',
    foot: '<button class="btn" data-x>Cancelar</button><button class="btn c3d co" id="ndOk">' + ic('check') + 'Guardar nota de débito</button>' });
  m.q('#ndFp').value = nd.fp;
  const calc = () => { const b = r2(parseFloat(String(m.q('#ndB').value).replace(',', '.')) || 0), p = parseFloat(String(m.q('#ndI').value).replace(',', '.')) || 0, i = r2(b * p / 100);
    m.q('#ndT').innerHTML = '<div class="totbox"><div><span>Subtotal ' + p + '%</span><b>' + money(b) + '</b></div><div><span>IVA ' + p + '%</span><b>' + money(i) + '</b></div><div class="big"><span>TOTAL</span><span>' + money(b + i) + '</span></div></div>';
    return { b, p, i }; };
  m.q('#ndB').oninput = calc; m.q('#ndI').oninput = calc; calc();
  m.q('#ndOk').onclick = async () => {
    const k = calc(); if (!(k.b > 0)) return toast('Escribe el valor de la nota de débito.', true);
    const comp = S.com.get(nd.ref) || c || {};
    Object.assign(nd, { num: m.q('#ndNum').value.trim(), f: m.q('#ndF').value || hoyISO(), conc: m.q('#ndC').value, fp: m.q('#ndFp').value, nota: m.q('#ndN').value.trim(),
      base: k.b, ivaP: k.p, sub12: k.p ? k.b : 0, sub0: k.p ? 0 : k.b, iva: k.i, tot: r2(k.b + k.i), ts: nd.ts || Date.now(), v: nd.v || USR.id,
      pl: m.q('#ndFp').value === 'cr' ? (comp.pl || 30) : 0, venc: m.q('#ndFp').value === 'cr' ? (comp.venc || sumarDias(m.q('#ndF').value || hoyISO(), comp.pl || 30)) : '' });
    await put('com', nd); m.close(); toast('Nota de débito guardada'); render();
  };
}
function verNotaDebito(n){
  const c = S.com.get(n.ref);
  const m = modal({ title: 'Nota de débito ' + (n.num || ''), body:
    (n.an ? '<div class="note warn" style="margin-bottom:10px">Anulada el ' + fechaTxt(n.an.f) + '</div>' : '') +
    '<p style="margin-top:0"><b>' + h(nomProv(n.pr)) + '</b> · ' + fechaTxt(n.f) + ' · ' + (n.fp === 'cr' ? 'A crédito, vence ' + fechaTxt(n.venc) : 'Pagada al contado') + '</p>' +
    '<div class="note" style="margin-bottom:10px">Modifica la compra <b>' + h(n.refNum || '') + '</b>' + (c ? ' del ' + fechaTxt(c.f) : '') + ' · Concepto: <b>' + h(n.conc) + '</b>' + (n.nota ? ' · ' + h(n.nota) : '') + '</div>' +
    '<div class="card"><div class="totbox"><div><span>Subtotal ' + (n.ivaP || 0) + '%</span><b>' + money(n.base) + '</b></div><div><span>IVA</span><b>' + money(n.iva) + '</b></div><div class="big"><span>TOTAL</span><span>' + money(n.tot) + '</span></div></div></div>',
    foot: '<button class="btn" data-x>Cerrar</button>' + (c ? '<button class="btn" id="ndVc">' + ic('doc') + 'Ver compra</button>' : '') + (!n.an && esAdmin() ? '<button class="btn" id="ndEd">' + ic('edit') + 'Editar</button><button class="btn danger" id="ndAn">' + ic('x') + 'Anular</button>' : '') });
  if (m.q('#ndVc')) m.q('#ndVc').onclick = () => { m.close(); verCompra(c); };
  if (m.q('#ndEd')) m.q('#ndEd').onclick = () => { m.close(); notaDebito(c, n); };

}

/* =====================================================================
   CLIENTES, PROVEEDORES, VENDEDORES, MENÚ Y AJUSTES
   ===================================================================== */
function editarCliente(c, onDone, pre){ editarTercero('cli', c, onDone, pre); }
const BANCOS = ['Banco Pichincha', 'Banco Guayaquil', 'Banco del Pacífico', 'Produbanco', 'Banco Bolivariano', 'Banco Internacional', 'Banco del Austro', 'Banco de Machala', 'Banco Solidario', 'BanEcuador', 'Coop. JEP', 'Coop. Jardín Azuayo', 'Coop. 29 de Octubre', 'Coop. Policía Nacional', 'Coop. Alianza del Valle'];
function editarTercero(t, rec, onDone, pre){
  const nuevo = !rec; const esP = t === 'prov';
  rec = rec || { id: uid(esP ? 'pr' : 'cl'), nombre: '', ruc: '', tel: '', correo: '', dir: '' };
  if (nuevo && pre) { if (/^\d{10,13}$/.test(pre.trim())) rec.ruc = pre.trim(); else if (/^0?9\d{8}$/.test(pre.trim())) rec.tel = pre.trim(); else rec.nombre = pre.trim().toUpperCase(); }
  let ctas = JSON.parse(JSON.stringify(rec.ctas || []));
  const m = modal({ title: (nuevo ? 'Nuevo ' : 'Editar ') + (esP ? 'proveedor' : 'cliente'), cls: esP ? 'narrow' : '', body: esP ?
    '<datalist id="dlBancos">' + BANCOS.map((b) => '<option value="' + b + '">').join('') + '</datalist>' +
    '<div class="stack provf"><label class="f">Nombre<input class="in" id="etN" value="' + h(rec.nombre) + '" autofocus placeholder="Nombre comercial"></label>' +
    '<label class="f">Razón social (beneficiario)<input class="in" id="etRs" value="' + h(rec.rs || '') + '" placeholder="Como aparece en el RUC y en las transferencias"></label>' +
    '<div class="grid2"><label class="f">RUC<input class="in" id="etR" inputmode="numeric" maxlength="13" value="' + h(rec.ruc) + '"></label>' +
    '<label class="f">Teléfono / WhatsApp<input class="in" id="etT" inputmode="tel" value="' + h(rec.tel) + '"></label></div>' +
    '<label class="f">Correo electrónico<input class="in" id="etC" type="email" inputmode="email" value="' + h(rec.correo) + '"></label>' +
    '<div class="grid2"><label class="f">Dirección<input class="in" id="etD" value="' + h(rec.dir) + '"></label>' +
    '<label class="f">Ciudad<input class="in" id="etCi" value="' + h(rec.ciu || '') + '"></label></div>' +
    '<div class="grid2"><label class="f">Nombre del vendedor<input class="in" id="etCo" value="' + h(rec.cont || '') + '"></label>' +
    '<label class="f">Teléfono del vendedor<input class="in" id="etCt" inputmode="tel" value="' + h(rec.ctel || '') + '"></label></div>' +
    '<div class="grid2"><label class="f">Cupo que otorga el proveedor<input class="in" id="etCu" inputmode="decimal" placeholder="$ 0.00" value="' + (rec.cupo || '') + '"></label>' +
